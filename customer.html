<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEST — Ambil Antrean</title>

<style>
    :root {
        --bg-deep: #120B23;
        --bg-surface: #1E1338;
        --bg-surface-2: #281a47;
        --accent: #7C3AED;
        --accent-glow: #C084FC;
        --text-main: #F3EEFF;
        --text-muted: #A99BD1;
        --ps5: #8B5CF6;
        --ps4: #6366F1;
        --nintendo: #D946EF;
        --racing: #22D3EE;
        --font-display: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-body: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        --font-mono: Consolas, "Roboto Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: radial-gradient(ellipse at top, #1a0f35 0%, var(--bg-deep) 55%, #0a0616 100%);
        color: var(--text-main);
        font-family: var(--font-body);
        padding: 30px 16px 70px;
        text-align: center;
        min-height: 100vh;
    }

    .logoMark { width: 52px; height: 52px; margin: 0 auto 14px; position: relative; }
    .logoMark::before, .logoMark::after {
        content: ''; position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, var(--accent-glow), var(--accent) 70%);
        box-shadow: 0 0 20px 3px rgba(124, 58, 237, 0.5);
    }
    .logoMark::before { width: 21px; height: 21px; left: 3px; top: 15px; }
    .logoMark::after { width: 21px; height: 21px; right: 3px; top: 15px; }
    .logoMark .bar {
        position: absolute; left: 10px; right: 10px; top: 21px; height: 11px;
        background: linear-gradient(135deg, var(--bg-surface-2), var(--bg-surface));
        border: 1px solid rgba(192, 132, 252, 0.4); border-radius: 8px;
    }

    h1.brand {
        font-family: var(--font-display); font-weight: 800; font-size: 34px; letter-spacing: 5px;
        margin: 0 0 2px;
        background: linear-gradient(135deg, #ffffff, var(--accent-glow));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .tagline {
        font-family: var(--font-display); font-size: 11px; letter-spacing: 3px;
        color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px;
    }
    .sub { font-size: 13px; color: var(--text-muted); margin: 4px 0 6px; }

    #statusKoneksi { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }
    #statusKoneksi.error { color: #f87171; font-weight: bold; }

    #btnNotif {
        background: linear-gradient(135deg, var(--accent), #5B21B6); color: white; border: none;
        padding: 10px 18px; border-radius: 20px; font-family: var(--font-display); font-weight: 600;
        font-size: 13px; cursor: pointer; margin-bottom: 16px;
    }
    #btnNotif:disabled { opacity: 0.6; }

    .gameGrid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 16px; max-width: 950px; margin: 0 auto 40px;
    }
    .gameCard {
        position: relative; background: linear-gradient(160deg, var(--bg-surface), #170e2c);
        border-radius: 18px; padding: 22px 20px; text-align: left; overflow: hidden;
        border: 1px solid rgba(255,255,255,0.06);
    }
    .gameCard::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .gameCard.ps5::before { background: var(--ps5); box-shadow: 0 0 14px var(--ps5); }
    .gameCard.ps4::before { background: var(--ps4); box-shadow: 0 0 14px var(--ps4); }
    .gameCard.nintendo::before { background: var(--nintendo); box-shadow: 0 0 14px var(--nintendo); }
    .gameCard.racing::before { background: var(--racing); box-shadow: 0 0 14px var(--racing); }
    .gameCard .icon { display: block; margin-bottom: 10px; filter: drop-shadow(0 0 6px rgba(192,132,252,0.35)); }
    .gameCard h4 { font-family: var(--font-display); margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    .gameCard .waiting-count { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
    .gameCard button {
        width: 100%; padding: 14px; border: none; border-radius: 10px;
        font-family: var(--font-display); font-weight: 600; font-size: 14px; cursor: pointer; color: white;
    }
    .gameCard.ps5 button { background: linear-gradient(135deg, var(--ps5), #6D28D9); }
    .gameCard.ps4 button { background: linear-gradient(135deg, var(--ps4), #4338CA); }
    .gameCard.nintendo button { background: linear-gradient(135deg, var(--nintendo), #A21CAF); }
    .gameCard.racing button { background: linear-gradient(135deg, var(--racing), #0891B2); }

    #tiketSaya { max-width: 700px; margin: 0 auto; text-align: left; }
    #tiketSaya h3 { font-family: var(--font-display); text-align: center; font-size: 15px; letter-spacing: 2px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 16px; }

    .tiketCard {
        background: linear-gradient(160deg, var(--bg-surface), #170e2c); border-radius: 16px; padding: 18px;
        margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.06); border-left: 4px solid #f59e0b;
    }
    .tiketCard.playing {
        border-left: 4px solid #4ade80;
        box-shadow: 0 0 30px -8px rgba(74,222,128,0.4);
        animation: pulseCard 1.6s ease-in-out infinite;
    }
    @keyframes pulseCard {
        0%, 100% { box-shadow: 0 0 16px -6px rgba(74,222,128,0.35); }
        50% { box-shadow: 0 0 30px 2px rgba(74,222,128,0.5); }
    }
    .tiketCard .idBesar { font-family: var(--font-mono); font-size: 24px; font-weight: bold; color: var(--accent-glow); }
    .tiketCard .statusText { font-size: 14px; margin-top: 6px; font-weight: 600; color: #fbbf24; }
    .tiketCard.playing .statusText { color: #4ade80; }

    .timerText { font-family: var(--font-mono); font-size: 26px; font-weight: bold; margin-top: 10px; color: #4ade80; }
    .timerText.warning { color: #facc15; }
    .timerText.habis { color: #f87171; }

    .tiketCard.selesai { border-left: 4px solid var(--accent); }
    .tiketCard.selesai .statusText { color: var(--accent-glow); }
    .tiketCard .pesanKesan { font-size: 12.5px; color: var(--text-muted); margin-top: 6px; font-style: italic; }
    .btnTutup {
        margin-top: 12px; padding: 8px 16px; font-size: 12.5px; border: none; border-radius: 8px;
        background: rgba(255,255,255,0.1); color: var(--text-main); cursor: pointer; font-weight: 600;
    }

    .empty-msg { color: var(--text-muted); font-size: 13px; padding: 10px 0; text-align: center; }
</style>
</head>

<body>

<div class="logoMark"><div class="bar"></div></div>
<h1 class="brand">PLAYNEST</h1>
<div class="tagline">Premium Gaming Lounge</div>
<p class="sub">Pilih permainan yang ingin kamu mainkan</p>
<p id="statusKoneksi">Menghubungkan ke server...</p>
<button id="btnNotif" onclick="aktifkanNotifikasi()">🔔 Aktifkan Notifikasi</button>

<div class="gameGrid" id="gameGrid"></div>

<div id="tiketSaya">
    <h3>🎫 Nomor Antrean Saya</h3>
    <div id="daftarTiketSaya"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";

    const JENIS_GAME = ["PS5", "PS4", "Nintendo", "Racing"];
    const TIKET_KEY = "playnest_tiket_saya";
    let semuaAntrean = [];
    let sedangProses = false;
    let notifDiizinkan = false;
    let statusSebelumnya = {};
    let judulAsli = document.title;
    let kedipInterval = null;

    const ICON_SVG = {
        PS5: `<svg class="icon" viewBox="0 0 64 40" width="50" height="31"><path d="M10 26 C6 26 4 22 6 16 C8 9 14 6 22 6 L42 6 C50 6 56 9 58 16 C60 22 58 26 54 26 C50 26 49 22 45 22 L19 22 C15 22 14 26 10 26 Z" fill="none" stroke="var(--ps5)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.4" fill="var(--ps5)"/><circle cx="48" cy="16" r="2.4" fill="none" stroke="var(--ps5)" stroke-width="1.6"/><circle cx="24" cy="12" r="1.6" fill="var(--ps5)"/><circle cx="24" cy="18" r="1.6" fill="var(--ps5)"/><line x1="21" y1="15" x2="27" y2="15" stroke="var(--ps5)" stroke-width="1.6"/></svg>`,
        PS4: `<svg class="icon" viewBox="0 0 64 40" width="50" height="31"><path d="M10 26 C6 26 4 22 6 16 C8 9 14 6 22 6 L42 6 C50 6 56 9 58 16 C60 22 58 26 54 26 C50 26 49 22 45 22 L19 22 C15 22 14 26 10 26 Z" fill="none" stroke="var(--ps4)" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.4" fill="var(--ps4)"/><circle cx="48" cy="16" r="2.4" fill="none" stroke="var(--ps4)" stroke-width="1.6"/><circle cx="24" cy="12" r="1.6" fill="var(--ps4)"/><circle cx="24" cy="18" r="1.6" fill="var(--ps4)"/><line x1="21" y1="15" x2="27" y2="15" stroke="var(--ps4)" stroke-width="1.6"/></svg>`,
        Nintendo: `<svg class="icon" viewBox="0 0 64 40" width="50" height="31"><rect x="8" y="4" width="18" height="32" rx="9" fill="none" stroke="var(--nintendo)" stroke-width="2.2"/><rect x="38" y="4" width="18" height="32" rx="9" fill="none" stroke="var(--nintendo)" stroke-width="2.2"/><circle cx="17" cy="14" r="2.2" fill="var(--nintendo)"/><line x1="14" y1="24" x2="20" y2="24" stroke="var(--nintendo)" stroke-width="1.8"/><line x1="17" y1="21" x2="17" y2="27" stroke="var(--nintendo)" stroke-width="1.8"/><circle cx="47" cy="14" r="1.8" fill="none" stroke="var(--nintendo)" stroke-width="1.4"/><circle cx="47" cy="24" r="1.8" fill="var(--nintendo)"/></svg>`,
        Racing: `<svg class="icon" viewBox="0 0 64 40" width="50" height="31"><circle cx="32" cy="20" r="15" fill="none" stroke="var(--racing)" stroke-width="2.2"/><circle cx="32" cy="20" r="4" fill="none" stroke="var(--racing)" stroke-width="1.8"/><line x1="32" y1="8" x2="32" y2="16" stroke="var(--racing)" stroke-width="2"/><line x1="21" y1="26" x2="28" y2="22" stroke="var(--racing)" stroke-width="2"/><line x1="43" y1="26" x2="36" y2="22" stroke="var(--racing)" stroke-width="2"/></svg>`
    };

    async function aktifkanNotifikasi() {
        if (!("Notification" in window)) { alert("Browser kamu tidak mendukung notifikasi. Tapi getar & suara tetap akan aktif."); return; }
        let izin = await Notification.requestPermission();
        if (izin === "granted") {
            notifDiizinkan = true;
            document.getElementById("btnNotif").textContent = "🔔 Notifikasi Aktif";
            document.getElementById("btnNotif").disabled = true;
        } else {
            alert("Notifikasi tidak diizinkan. Kamu tetap bisa lihat status di halaman ini.");
        }
    }

    function beep() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.25, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.35);
        } catch (e) {}
    }

    function kedipkanJudul(teks) {
        if (kedipInterval) clearInterval(kedipInterval);
        let tampil = true;
        kedipInterval = setInterval(() => {
            document.title = tampil ? teks : judulAsli;
            tampil = !tampil;
        }, 1000);
        setTimeout(() => { clearInterval(kedipInterval); document.title = judulAsli; }, 15000);
    }

    function kirimNotifikasi(judul, pesan) {
        if (navigator.vibrate) navigator.vibrate([250, 100, 250, 100, 250]);
        beep();
        kedipkanJudul("🔔 " + judul);
        if (notifDiizinkan && "Notification" in window && Notification.permission === "granted") {
            try { new Notification(judul, { body: pesan }); } catch (e) {}
        }
    }

    function muatTiketSaya() {
        let data = localStorage.getItem(TIKET_KEY);
        return data ? JSON.parse(data) : [];
    }

    function simpanTiketSaya(daftar) {
        localStorage.setItem(TIKET_KEY, JSON.stringify(daftar));
    }

    function tambahTiketSaya(queueId, customer, game, players) {
        let daftar = muatTiketSaya();
        daftar.push({ id: queueId, customer: customer, game: game, players: players, selesai: false, notif10: false });
        simpanTiketSaya(daftar);
    }

    function tutupTiket(queueId) {
        let daftar = muatTiketSaya().filter(t => t.id !== queueId);
        simpanTiketSaya(daftar);
        render();
    }

    function hitungSisaDetik(item) {
        if (!item.mulaiMain || !item.durasiMenit) return null;
        let totalDetik = item.durasiMenit * 60;
        let berlaluDetik = Math.floor((Date.now() - item.mulaiMain) / 1000);
        return totalDetik - berlaluDetik;
    }

    function formatWaktu(detik) {
        let minus = detik < 0;
        let absDetik = Math.abs(detik);
        let mm = Math.floor(absDetik / 60);
        let ss = absDetik % 60;
        let teks = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
        return minus ? "-" + teks : teks;
    }

    async function panggilAPI(params) {
        params._ts = Date.now();
        let url = API_URL + "?" + new URLSearchParams(params).toString();
        let res = await fetch(url, { cache: "no-store" });
        let json = await res.json();
        return json;
    }

    async function muatData() {
        try {
            let hasil = await panggilAPI({ action: "list" });
            if (hasil.success) {
                semuaAntrean = hasil.data;
                document.getElementById("statusKoneksi").textContent = "Terhubung — data tersinkron";
                document.getElementById("statusKoneksi").classList.remove("error");
                cekPerubahanStatus();
                render();
            } else {
                tampilkanErrorKoneksi(hasil.message);
            }
        } catch (err) {
            tampilkanErrorKoneksi(err.toString());
        }
    }

    function tampilkanErrorKoneksi(pesan) {
        let el = document.getElementById("statusKoneksi");
        el.textContent = "Gagal terhubung ke server. (" + pesan + ")";
        el.classList.add("error");
    }

    async function ambilAntrean(game) {
        if (sedangProses) return;
        let namaCustomer = prompt("Nama kamu:", "");
        if (namaCustomer === null) return;
        if (namaCustomer.trim() === "") namaCustomer = "Tanpa Nama";

        let jumlahPlayer = prompt("Jumlah pemain:", "1");
        if (jumlahPlayer === null) return;
        jumlahPlayer = parseInt(jumlahPlayer) || 1;

        sedangProses = true;
        let hasil = await panggilAPI({ action: "add", game: game, customer: namaCustomer, players: jumlahPlayer });
        sedangProses = false;

        if (!hasil.success) { alert("Gagal mengambil antrean: " + hasil.message); return; }

        tambahTiketSaya(hasil.queueId, namaCustomer, game, jumlahPlayer);
        alert("Berhasil! Nomor antrean kamu: " + hasil.queueId);
        await muatData();
    }

    function cekPerubahanStatus() {
        let tiketSaya = muatTiketSaya();
        let perluDisimpanUlang = false;

        tiketSaya.forEach(t => {
            let tiketServer = semuaAntrean.find(i => i.queueId === t.id);

            if (tiketServer) {
                let statusLama = statusSebelumnya[t.id];
                if (statusLama === "WAITING" && tiketServer.status === "PLAYING") {
                    kirimNotifikasi("Giliran Kamu!", t.id + " — Silakan menuju kasir untuk memulai sesi.");
                }
                statusSebelumnya[t.id] = tiketServer.status;

                if (tiketServer.status === "PLAYING" && tiketServer.mulaiMain && !t.notif10) {
                    let sisaDetik = hitungSisaDetik(tiketServer);
                    if (sisaDetik !== null && sisaDetik <= 600 && sisaDetik > 0) {
                        t.notif10 = true;
                        perluDisimpanUlang = true;
                        kirimNotifikasi("⏳ 10 Menit Lagi", "Sisa waktu bermainmu tinggal 10 menit. Nikmati momen terakhirnya, dan terima kasih sudah bermain di PLAYNEST! 🎮");
                    }
                }
            } else if (!t.selesai) {
                t.selesai = true;
                perluDisimpanUlang = true;
                kirimNotifikasi("Sesi Selesai", t.id + " — Terima kasih sudah bermain di PLAYNEST!");
                delete statusSebelumnya[t.id];
            }
        });

        if (perluDisimpanUlang) simpanTiketSaya(tiketSaya);
    }

    function render() {
        let grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        JENIS_GAME.forEach(game => {
            let menunggu = semuaAntrean.filter(i => i.game === game && i.status === "WAITING");
            let kelas = game.toLowerCase();

            let card = document.createElement("div");
            card.className = "gameCard " + kelas;
            card.innerHTML = `
                ${ICON_SVG[game]}
                <h4>${game}</h4>
                <div class="waiting-count">${menunggu.length} orang menunggu</div>
                <button onclick="ambilAntrean('${game}')">Ambil Antrean</button>
            `;
            grid.appendChild(card);
        });

        let tiketSaya = muatTiketSaya();
        let container = document.getElementById("daftarTiketSaya");

        if (tiketSaya.length === 0) {
            container.innerHTML = '<p class="empty-msg">Kamu belum mengambil antrean</p>';
            return;
        }

        let html = "";

        tiketSaya.forEach(t => {
            let tiketServer = semuaAntrean.find(i => i.queueId === t.id);

            if (tiketServer) {
                let cls = "";
                let statusText = "";
                let extraHtml = "";

                if (tiketServer.status === "WAITING") {
                    let antreanGame = semuaAntrean.filter(i => i.game === tiketServer.game && i.status === "WAITING");
                    let posisi = antreanGame.findIndex(i => i.queueId === t.id) + 1;
                    statusText = "🟡 Posisi antrean: ke-" + posisi;
                    if (posisi === 1) statusText += " — sebentar lagi giliranmu!";
                } else if (tiketServer.status === "PLAYING" && !tiketServer.mulaiMain) {
                    cls = "playing";
                    statusText = "🟢 GILIRAN KAMU! Silakan menuju kasir untuk memulai sesi.";
                } else if (tiketServer.status === "PLAYING" && tiketServer.mulaiMain) {
                    cls = "playing";
                    let sisaDetik = hitungSisaDetik(tiketServer);

                    if (sisaDetik !== null) {
                        let warnaKelas = sisaDetik <= 0 ? "habis" : (sisaDetik <= 600 ? "warning" : "");
                        statusText = "🟢 Sedang bermain";
                        extraHtml = `<div class="timerText ${warnaKelas}">${sisaDetik <= 0 ? "⚠️ Waktu habis" : formatWaktu(sisaDetik)}</div>`;
                    } else {
                        statusText = "🟢 Sedang bermain";
                    }
                }

                html += `
                    <div class="tiketCard ${cls}">
                        <div class="idBesar">${tiketServer.queueId}</div>
                        <div>${tiketServer.customer} — ${tiketServer.players} pemain</div>
                        <div class="statusText">${statusText}</div>
                        ${extraHtml}
                    </div>
                `;
            } else if (t.selesai) {
                html += `
                    <div class="tiketCard selesai">
                        <div class="idBesar">${t.id} ✅</div>
                        <div>${t.customer} — ${t.players} pemain</div>
                        <div class="statusText">🎉 SELESAI — Terima kasih sudah bermain di PLAYNEST!</div>
                        <div class="pesanKesan">Semoga betah dan sampai jumpa lagi 💜</div>
                        <button class="btnTutup" onclick="tutupTiket('${t.id}')">Tutup</button>
                    </div>
                `;
            }
        });

        container.innerHTML = html || '<p class="empty-msg">Kamu belum mengambil antrean</p>';
    }

    muatData();
    setInterval(muatData, 3000);
    setInterval(render, 1000);

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) muatData();
    });
</script>

</body>
</html>
