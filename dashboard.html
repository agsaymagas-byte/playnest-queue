<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEST CONTROL</title>

<style>
    :root {
        --bg-deep: #120B23;
        --bg-surface: #1E1338;
        --bg-surface-2: #281a47;
        --accent: #7C3AED;
        --accent-glow: #C084FC;
        --text-main: #F3EEFF;
        --text-muted: #A99BD1;
        --font-display: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --font-mono: Consolas, "Roboto Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: radial-gradient(ellipse at top, #1a0f35 0%, var(--bg-deep) 55%, #0a0616 100%);
        color: var(--text-main);
        font-family: var(--font-display);
        padding: 30px 16px 70px;
        text-align: center;
        min-height: 100vh;
    }

    .logoMark { width: 52px; height: 52px; margin: 0 auto 14px; position: relative; }
    .logoMark::before, .logoMark::after {
        content: ''; position: absolute; border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, var(--accent-glow), var(--accent) 70%);
        box-shadow: 0 0 20px 3px rgba(124, 58, 237, 0.5);
    }
    .logoMark::before { width: 21px; height: 21px; left: 3px; top: 15px; }
    .logoMark::after { width: 21px; height: 21px; right: 3px; top: 15px; }
    .logoMark .bar {
        position: absolute; left: 10px; right: 10px; top: 21px; height: 11px;
        background: linear-gradient(135deg, var(--bg-surface-2), var(--bg-surface));
        border: 1px solid rgba(192, 132, 252, 0.4); border-radius: 8px;
    }

    h1.brand {
        font-weight: 800; font-size: 30px; letter-spacing: 5px; margin: 0 0 2px;
        background: linear-gradient(135deg, #ffffff, var(--accent-glow));
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .subtitle { color: var(--text-muted); font-size: 12px; letter-spacing: 2px; margin-bottom: 6px; }
    #statusKoneksi { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }
    #statusKoneksi.error { color: #f87171; font-weight: bold; }

    .ringkasan { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; max-width: 900px; margin: 0 auto 26px; }
    .ringkasan .kotak { background: var(--bg-surface); border: 1px solid rgba(192,132,252,0.2); border-radius: 12px; padding: 12px 18px; min-width: 90px; }
    .ringkasan .angka { font-size: 24px; font-weight: bold; color: var(--accent-glow); }
    .ringkasan .label { font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

    .unitGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; max-width: 1100px; margin: 0 auto; }

    .unitCard { background: linear-gradient(160deg, var(--bg-surface), #170e2c); border: 1px solid rgba(255,255,255,0.06); border-radius: 14px; padding: 16px; text-align: left; }
    .unitCard.belumMulai { border-color: rgba(192,132,252,0.4); }
    .unitCard.playing { border-color: #22c55e; }
    .unitCard.warning { border-color: #eab308; animation: blinkWarn 1.5s infinite; }
    .unitCard.expired { border-color: #ef4444; animation: blinkExpired 0.8s infinite; }

    @keyframes blinkWarn { 0%,100% { box-shadow: 0 0 0 0 rgba(234,179,8,0); } 50% { box-shadow: 0 0 0 6px rgba(234,179,8,0.15); } }
    @keyframes blinkExpired { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0.25); } }

    .unitCard .baris1 { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .unitCard .idUnit { font-family: var(--font-mono); font-size: 16px; font-weight: bold; color: var(--accent-glow); }
    .statusDot { font-size: 11px; padding: 2px 9px; border-radius: 10px; font-weight: bold; }
    .statusDot.playing { background: rgba(34,197,94,0.15); color: #4ade80; }
    .statusDot.belumMulai { background: rgba(192,132,252,0.15); color: var(--accent-glow); }

    .unitCard .customer { font-size: 15px; margin-bottom: 3px; }
    .unitCard .players { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }

    .timerBox { font-family: var(--font-mono); font-size: 26px; font-weight: bold; text-align: center; padding: 8px; border-radius: 8px; background: rgba(0,0,0,0.25); letter-spacing: 2px; }
    .timerBox.normal { color: #4ade80; }
    .timerBox.warning { color: #facc15; }
    .timerBox.expired { color: #f87171; }
    .belumMulaiText { font-size: 13px; color: var(--accent-glow); text-align: center; padding: 10px; }

    .antrianBox { max-width: 1100px; margin: 30px auto 0; text-align: left; }
    .antrianBox h3 { font-size: 12px; letter-spacing: 2px; color: var(--text-muted); text-align: center; }
    .antrianList { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .antrianChip { background: var(--bg-surface); border: 1px solid rgba(192,132,252,0.2); border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--text-muted); }

    .empty-msg { color: var(--text-muted); font-size: 13px; padding: 20px; }
</style>
</head>

<body>

<div class="logoMark"><div class="bar"></div></div>
<h1 class="brand">PLAYNEST CONTROL</h1>
<div class="subtitle">DASHBOARD CAPTAIN — LIVE MONITORING</div>
<p id="statusKoneksi">Menghubungkan ke server...</p>

<div class="ringkasan">
    <div class="kotak"><div class="angka" id="jmlPlaying">0</div><div class="label">SEDANG MAIN</div></div>
    <div class="kotak"><div class="angka" id="jmlWaiting">0</div><div class="label">MENUNGGU</div></div>
    <div class="kotak"><div class="angka" id="jmlWarning">0</div><div class="label">HAMPIR HABIS</div></div>
    <div class="kotak"><div class="angka" id="jmlExpired">0</div><div class="label">WAKTU HABIS</div></div>
</div>

<div class="unitGrid" id="unitGrid"></div>

<div class="antrianBox">
    <h3>⏳ ANTREAN MENUNGGU</h3>
    <div class="antrianList" id="antrianList"></div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";
    let semuaAntrean = [];

    async function panggilAPI(params) {
        params._ts = Date.now();
        let url = API_URL + "?" + new URLSearchParams(params).toString();
        let res = await fetch(url, { cache: "no-store" });
        let json = await res.json();
        return json;
    }

    async function muatData() {
        try {
            let hasil = await panggilAPI({ action: "list" });
            if (hasil.success) {
                semuaAntrean = hasil.data;
                document.getElementById("statusKoneksi").textContent = "Terhubung — data tersinkron";
                document.getElementById("statusKoneksi").classList.remove("error");
                render();
            } else {
                tampilkanErrorKoneksi(hasil.message);
            }
        } catch (err) {
            tampilkanErrorKoneksi(err.toString());
        }
    }

    function tampilkanErrorKoneksi(pesan) {
        let el = document.getElementById("statusKoneksi");
        el.textContent = "Gagal terhubung ke server. (" + pesan + ")";
        el.classList.add("error");
    }

    function hitungSisaDetik(item) {
        if (!item.mulaiMain || !item.durasiMenit) return null;
        let totalDetik = item.durasiMenit * 60;
        let berlaluDetik = Math.floor((Date.now() - item.mulaiMain) / 1000);
        return totalDetik - berlaluDetik;
    }

    function formatWaktu(detik) {
        let minus = detik < 0;
        let absDetik = Math.abs(detik);
        let mm = Math.floor(absDetik / 60);
        let ss = absDetik % 60;
        let teks = String(mm).padStart(2, "0") + ":" + String(ss).padStart(2, "0");
        return minus ? "-" + teks : teks;
    }

    function statusTimer(sisaDetik) {
        if (sisaDetik === null) return "normal";
        if (sisaDetik <= 0) return "expired";
        if (sisaDetik <= 600) return "warning";
        return "normal";
    }

    function render() {
        let playingList = semuaAntrean.filter(i => i.status === "PLAYING");
        let waitingList = semuaAntrean.filter(i => i.status === "WAITING");

        let jmlWarning = 0, jmlExpired = 0;
        let grid = document.getElementById("unitGrid");

        if (playingList.length === 0) {
            grid.innerHTML = '<p class="empty-msg">Belum ada unit yang sedang dipakai</p>';
        } else {
            grid.innerHTML = playingList.map(item => {
                if (!item.mulaiMain) {
                    return `
                        <div class="unitCard belumMulai">
                            <div class="baris1">
                                <span class="idUnit">${item.queueId}</span>
                                <span class="statusDot belumMulai">DIPANGGIL</span>
                            </div>
                            <div class="customer">${item.customer}</div>
                            <div class="players">${item.players} pemain — ${item.game}</div>
                            <div class="belumMulaiText">⏳ Menunggu kedatangan customer</div>
                        </div>
                    `;
                }

                let sisaDetik = hitungSisaDetik(item);
                let statusW = statusTimer(sisaDetik);
                if (statusW === "warning") jmlWarning++;
                if (statusW === "expired") jmlExpired++;

                let cardCls = statusW === "expired" ? "playing expired" : (statusW === "warning" ? "playing warning" : "playing");
                let timerText = sisaDetik === null ? "—:—" : formatWaktu(sisaDetik);

                return `
                    <div class="unitCard ${cardCls}">
                        <div class="baris1">
                            <span class="idUnit">${item.queueId}</span>
                            <span class="statusDot playing">PLAYING</span>
                        </div>
                        <div class="customer">${item.customer}</div>
                        <div class="players">${item.players} pemain — ${item.game}</div>
                        <div class="timerBox ${statusW}">${timerText}</div>
                    </div>
                `;
            }).join("");
        }

        document.getElementById("jmlPlaying").textContent = playingList.length;
        document.getElementById("jmlWaiting").textContent = waitingList.length;
        document.getElementById("jmlWarning").textContent = jmlWarning;
        document.getElementById("jmlExpired").textContent = jmlExpired;

        let antrianList = document.getElementById("antrianList");
        if (waitingList.length === 0) {
            antrianList.innerHTML = '<p class="empty-msg">Tidak ada yang menunggu</p>';
        } else {
            antrianList.innerHTML = waitingList.map(item => `<span class="antrianChip">${item.queueId} — ${item.customer}</span>`).join("");
        }
    }

    muatData();
    setInterval(muatData, 3000);
    setInterval(render, 1000);
</script>

</body>
</html>
