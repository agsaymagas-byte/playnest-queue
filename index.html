<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PLAYNEST CONTROL</title>

<style>
:root {
    --bg: #090314;
    --surface: #120720;
    --surface2: #190b2d;
    --purple: #8b5cf6;
    --purple2: #c084fc;
    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --blue: #38bdf8;
    --text: #f5efff;
    --muted: #a99bd1;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #24103f 0%, #090314 55%, #050208 100%);
    color: var(--text);
    font-family: Arial, sans-serif;
    padding: 20px 12px 60px;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* ================= HEADER ================= */

header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 13px;
    letter-spacing: 7px;
    color: var(--purple2);
    margin-bottom: 8px;
}

h1 {
    margin: 0;
    font-size: clamp(25px, 6vw, 36px);
    letter-spacing: 5px;
    font-weight: 800;
}

.subtitle {
    color: var(--muted);
    letter-spacing: 2px;
    font-size: 11px;
    margin-top: 8px;
}

#connection {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
}

#connection.error {
    color: var(--red);
    font-weight: bold;
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 25px;
}

.stat {
    background: rgba(18,7,32,.9);
    border: 1px solid rgba(192,132,252,.12);
    border-radius: 16px;
    padding: 15px 7px;
    text-align: center;
}

.stat-number {
    font-size: 28px;
    font-weight: 800;
    color: var(--purple2);
}

.stat-label {
    margin-top: 5px;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 1px;
}

/* ================= SECTION ================= */

.section-title {
    text-align: center;
    color: var(--purple2);
    font-size: 13px;
    letter-spacing: 2px;
    margin: 28px 0 15px;
    font-weight: bold;
}

/* ================= GAME SUMMARY ================= */

.game-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.game-box {
    background: rgba(18,7,32,.75);
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 14px;
    padding: 13px 6px;
    text-align: center;
}

.game-name {
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.game-count {
    color: var(--muted);
    font-size: 11px;
    line-height: 1.7;
}

/* ================= QUEUE ================= */

.queue-list {
    display: grid;
    gap: 12px;
}

.queue-card {
    background: linear-gradient(145deg, var(--surface2), var(--surface));
    border: 1px solid rgba(255,255,255,.06);
    border-left: 4px solid var(--yellow);
    border-radius: 17px;
    padding: 17px;
    overflow: hidden;
}

.queue-card.playing {
    border-left-color: var(--green);
    box-shadow: 0 0 25px rgba(74,222,128,.08);
}

.queue-card.expired-card {
    border-left-color: var(--red);
    box-shadow: 0 0 20px rgba(248,113,113,.08);
}

.queue-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
}

.queue-id {
    font-family: Consolas, monospace;
    font-size: 23px;
    font-weight: bold;
    color: var(--purple2);
}

.customer {
    margin-top: 5px;
    font-size: 14px;
}

.game {
    margin-top: 5px;
    color: var(--muted);
    font-size: 12px;
}

.status {
    display: inline-block;
    padding: 6px 9px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: bold;
    white-space: nowrap;
}

.status.waiting {
    background: rgba(250,204,21,.12);
    color: var(--yellow);
}

.status.playing {
    background: rgba(74,222,128,.12);
    color: var(--green);
}

.status.expired {
    background: rgba(248,113,113,.12);
    color: var(--red);
}

/* ================= TIMER ================= */

.timer {
    text-align: center;
    font-family: Consolas, monospace;
    font-size: clamp(34px, 10vw, 46px);
    font-weight: bold;
    margin: 17px 0 8px;
    color: var(--green);
}

.timer.warning {
    color: var(--yellow);
}

.timer.expired {
    color: var(--red);
}

.info {
    color: var(--muted);
    font-size: 12px;
    margin-top: 10px;
}

.timer-note {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
}

/* ================= BUTTONS ================= */

.buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-top: 17px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 10px;
    color: white;
    font-weight: bold;
    cursor: pointer;
    font-size: 12px;
    min-height: 43px;
    transition: transform .1s, opacity .1s;
}

button:active {
    transform: scale(.97);
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.btn-call {
    background: linear-gradient(135deg, #f59e0b, #d97706);
}

.btn-start {
    background: linear-gradient(135deg, #22c55e, #15803d);
}

.btn-add {
    background: linear-gradient(135deg, #7c3aed, #6d28d9);
}

.btn-minus {
    background: linear-gradient(135deg, #4b5563, #374151);
}

.btn-done {
    background: linear-gradient(135deg, #16a34a, #166534);
}

.btn-delete {
    background: linear-gradient(135deg, #dc2626, #991b1b);
}

.btn-refresh {
    width: 100%;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    margin-top: 12px;
}

/* ================= EMPTY ================= */

.empty {
    text-align: center;
    color: var(--muted);
    padding: 35px 10px;
    background: rgba(18,7,32,.5);
    border-radius: 15px;
}

/* ================= MOBILE ================= */

@media(max-width:700px) {

    body {
        padding: 18px 10px 50px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .game-summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .queue-top {
        flex-direction: column;
    }

    .queue-top > div:last-child {
        width: 100%;
    }

    .status {
        display: block;
        text-align: center;
        width: 100%;
    }

    .buttons {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media(max-width:380px) {

    .buttons {
        grid-template-columns: 1fr;
    }

    .queue-id {
        font-size: 21px;
    }

    .stat-number {
        font-size: 25px;
    }
}
</style>
</head>

<script>

/* =====================================================
   PLAYNEST CAPTAIN CONTROL
   ===================================================== */

/*
   PENTING:
   URL ini harus sama dengan Web App
   Google Apps Script PLAYNEST.
*/

const API_URL =
"https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";


const GAMES = [
    "PS5",
    "PS4",
    "Nintendo",
    "Racing"
];


let semuaAntrean = [];
let sedangProses = false;


/* =====================================================
   API
   ===================================================== */

async function panggilAPI(params) {

    params._ts = Date.now();

    const url =
        API_URL +
        "?" +
        new URLSearchParams(params).toString();

    const response = await fetch(url, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "Server HTTP " + response.status
        );
    }

    return await response.json();
}


/* =====================================================
   LOAD DATA
   ===================================================== */

async function muatData() {

    if (sedangProses) return;

    try {

        const hasil =
            await panggilAPI({
                action: "list"
            });

        if (!hasil.success) {

            tampilkanError(
                hasil.message || "Server error"
            );

            return;
        }

        semuaAntrean =
            Array.isArray(hasil.data)
            ? hasil.data
            : [];

        const connection =
            document.getElementById("connection");

        connection.textContent =
            "🟢 Terhubung — " +
            new Date().toLocaleTimeString(
                "id-ID"
            );

        connection.classList.remove("error");

        render();

    } catch(error) {

        tampilkanError(error.message);

        console.error(error);

    }
}


function tampilkanError(message) {

    const el =
        document.getElementById("connection");

    el.textContent =
        "🔴 Gagal terhubung ke server";

    el.classList.add("error");

    console.error(
        "PLAYNEST API ERROR:",
        message
    );
}


/* =====================================================
   PANGGIL ANTREAN
   ===================================================== */

async function panggilAntrean(game) {

    if (sedangProses) return;

    const menunggu =
        semuaAntrean.filter(
            item =>
                item.game === game &&
                item.status === "WAITING"
        );

    if (menunggu.length === 0) {

        alert(
            "Tidak ada antrean menunggu untuk " +
            game
        );

        return;
    }


    const pertama = menunggu[0];

    const yakin =
        confirm(
            "Panggil antrean berikutnya?\n\n" +
            "🎫 " + pertama.queueId +
            "\n👤 " + pertama.customer +
            "\n🎮 " + pertama.game
        );

    if (!yakin) return;


    sedangProses = true;

    try {

        const hasil =
            await panggilAPI({
                action: "call",
                game: game
            });

        if (!hasil.success) {

            alert(
                "❌ " +
                (hasil.message ||
                "Gagal memanggil antrean.")
            );

        } else {

            alert(
                "📣 ANTREAN DIPANGGIL!\n\n" +
                "🎫 " + hasil.queueId +
                "\n👤 " + hasil.customer +
                "\n👥 " + hasil.players +
                " pemain\n\n" +
                "Silakan arahkan customer ke kasir."
            );

            await muatData();
        }

    } catch(error) {

        alert(
            "❌ Terjadi kesalahan saat memanggil antrean."
        );

        console.error(error);

    }

    sedangProses = false;
}
