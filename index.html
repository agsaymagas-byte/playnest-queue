<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>PLAYNEST CONTROL</title>

<style>

:root {
    --bg: #090314;
    --surface: #10051c;
    --surface2: #180827;

    --purple: #8b5cf6;
    --purple2: #c084fc;

    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;

    --text: #f7f1ff;
    --muted: #a99bd1;

    --border: rgba(192,132,252,.13);
}

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #25103f 0%,
            #0d0318 42%,
            #050208 100%
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding:
        24px
        14px
        70px;
}

button {

    border: none;

    outline: none;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 13px;

    border-radius: 12px;

    padding: 13px 15px;

    transition:
        transform .15s ease,
        opacity .15s ease;
}

button:active {
    transform: scale(.97);
}

button:disabled {

    opacity: .45;

    cursor: not-allowed;
}


/* =========================
   CONTAINER
========================= */

.container {

    width: 100%;

    max-width: 900px;

    margin: auto;
}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    margin-bottom: 30px;
}

.logo {

    font-size: 14px;

    letter-spacing: 8px;

    color: var(--purple2);

    margin-bottom: 10px;
}

h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: 5px;

    font-weight: 800;
}

.subtitle {

    margin-top: 9px;

    color: var(--muted);

    font-size: 12px;

    letter-spacing: 3px;
}

#connection {

    margin-top: 17px;

    color: var(--muted);

    font-size: 13px;

    min-height: 18px;
}

#connection.ok {
    color: var(--green);
}

#connection.error {
    color: var(--yellow);
}


/* =========================
   ACTION BAR
========================= */

.action-bar {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 9px;

    margin-bottom: 30px;
}

.action-btn {

    min-height: 52px;

    background:
        linear-gradient(
            135deg,
            #241044,
            #130622
        );

    border:
        1px solid
        rgba(192,132,252,.16);

    color: var(--purple2);

    font-size: 11px;

    letter-spacing: .5px;
}

.action-btn:hover {
    border-color: var(--purple2);
}

.action-btn span {

    display: block;

    font-size: 19px;

    margin-bottom: 3px;
}


/* =========================
   STATS
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 30px;
}

.stat {

    background:
        rgba(10,2,20,.72);

    border:
        1px solid
        var(--border);

    border-radius: 20px;

    padding: 20px 10px;

    text-align: center;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.18);
}

.stat-number {

    font-size: 34px;

    font-weight: 800;

    color: var(--purple2);
}

.stat-label {

    margin-top: 7px;

    color: var(--muted);

    font-size: 11px;

    letter-spacing: 1.5px;
}


/* =========================
   SECTION TITLE
========================= */

.section-title {

    text-align: center;

    color: var(--purple2);

    font-size: 14px;

    letter-spacing: 3px;

    margin:
        34px
        0
        18px;
}


/* =========================
   GAME SUMMARY
========================= */

.game-summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;
}

.game-box {

    background:
        rgba(10,2,20,.72);

    border:
        1px solid
        var(--border);

    border-radius: 16px;

    padding: 16px 8px;

    text-align: center;
}

.game-name {

    font-size: 17px;

    font-weight: bold;

    margin-bottom: 7px;
}

.game-count {

    color: var(--muted);

    font-size: 12px;

    line-height: 20px;
}


/* =========================
   QUEUE LIST
========================= */

.queue-list {

    display: grid;

    gap: 15px;
}

.queue-card {

    background:
        linear-gradient(
            145deg,
            #1a082b,
            #10051b
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    border-left:
        4px solid
        var(--yellow);

    border-radius: 20px;

    padding: 20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.20);
}

.queue-card.playing {

    border-left-color:
        var(--green);

    box-shadow:
        0 0 25px
        rgba(74,222,128,.07);
}

.queue-card.expired {

    border-left-color:
        var(--red);
}

.queue-top {

    display: flex;

    justify-content:
        space-between;

    align-items:
        flex-start;

    gap: 15px;
}

.queue-id {

    font-family:
        Consolas,
        monospace;

    font-size: 26px;

    font-weight: bold;

    color: var(--purple2);
}

.customer {

    margin-top: 6px;

    font-size: 16px;
}

.game {

    margin-top: 6px;

    color: var(--muted);

    font-size: 13px;
}


/* =========================
   STATUS
========================= */

.status {

    display: inline-block;

    padding:
        7px
        11px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

    white-space: nowrap;
}

.status.waiting {

    background:
        rgba(250,204,21,.12);

    color:
        var(--yellow);
}

.status.called {

    background:
        rgba(192,132,252,.12);

    color:
        var(--purple2);
}

.status.playing {

    background:
        rgba(74,222,128,.12);

    color:
        var(--green);
}

.status.expired {

    background:
        rgba(248,113,113,.12);

    color:
        var(--red);
}


/* =========================
   TIMER
========================= */

.timer {

    text-align: center;

    font-family:
        Consolas,
        monospace;

    font-size: 42px;

    font-weight: bold;

    margin:
        20px
        0
        8px;

    color:
        var(--green);

    letter-spacing: 2px;
}

.timer.warning {
    color: var(--yellow);
}

.timer.expired {
    color: var(--red);
}

.info {

    color: var(--muted);

    font-size: 13px;

    margin-top: 12px;

    line-height: 21px;
}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin-top: 18px;
}

.btn-call {

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );
}

.btn-start {

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );
}

.btn-add {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6d28d9
        );
}

.btn-minus {

    background:
        linear-gradient(
            135deg,
            #4b5563,
            #374151
        );
}

.btn-done {

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #166534
        );
}

.btn-delete {

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );
}

.btn-refresh {

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #4338ca
        );
}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    color: var(--muted);

    padding:
        45px
        10px;

    font-size: 15px;
}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    margin-top: 45px;

    color:
        rgba(169,155,209,.55);

    font-size: 11px;

    letter-spacing: 1px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    body {

        padding:
            20px
            11px
            55px;
    }

    h1 {

        font-size: 25px;

        letter-spacing: 4px;
    }

    .subtitle {

        font-size: 10px;

        letter-spacing: 2px;
    }

    .action-bar {

        grid-template-columns:
            repeat(2,1fr);
    }

    .stats {

        grid-template-columns:
            repeat(2,1fr);

        gap: 10px;
    }

    .stat {

        padding:
            18px
            8px;
    }

    .stat-number {

        font-size: 32px;
    }

    .game-summary {

        grid-template-columns:
            repeat(2,1fr);
    }

    .queue-top {

        flex-direction:
            column;
    }

    .queue-top > div:last-child {

        width: 100%;
    }

    .status {

        display: block;

        width: 100%;

        text-align: center;
    }

    .queue-id {

        font-size: 25px;
    }

    .timer {

        font-size: 36px;
    }

    .buttons {

        grid-template-columns:
            1fr;
    }

    button {

        width: 100%;

        min-height: 47px;
    }
}

</style>

</head>

<div class="container">

<script>

/* =====================================================
   PLAYNEST CONTROL — CAPTAIN FINAL
   ===================================================== */


/* =========================
   API
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";


/* =========================
   GAME LIST
========================= */

const GAMES = [
    "PS5",
    "PS4",
    "Nintendo",
    "Racing"
];


/* =========================
   GLOBAL DATA
========================= */

let semuaAntrean = [];

let sedangProses = false;

let sedangLoad = false;


/* =====================================================
   API REQUEST
===================================================== */

async function panggilAPI(params) {

    params._ts = Date.now();

    const url =
        API_URL +
        "?" +
        new URLSearchParams(params).toString();

    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );
    }

    const text =
        await response.text();

    if (!text) {

        throw new Error(
            "Server tidak mengirim data."
        );
    }

    try {

        return JSON.parse(text);

    } catch(error) {

        throw new Error(
            "Respons server bukan JSON."
        );
    }
}


/* =====================================================
   CONNECTION STATUS
===================================================== */

function setConnection(text, type = "") {

    const el =
        document.getElementById(
            "connection"
        );

    el.textContent = text;

    el.className = type;
}


/* =====================================================
   LOAD DATA
===================================================== */

async function muatData() {

    /*
       Jangan jalankan request kedua
       jika request sebelumnya belum selesai.
    */

    if (sedangLoad) return;

    sedangLoad = true;

    try {

        const hasil =
            await panggilAPI({
                action: "list"
            });


        if (!hasil ||
            hasil.success !== true) {

            throw new Error(
                hasil?.message ||
                "Data tidak berhasil dimuat."
            );
        }


        /*
           Hanya ganti data jika server
           benar-benar mengirim array.
        */

        if (Array.isArray(hasil.data)) {

            semuaAntrean =
                hasil.data;

        } else {

            semuaAntrean = [];

        }


        setConnection(
            "Terhubung — data tersinkron • " +
            new Date().toLocaleTimeString(
                "id-ID",
                {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            ),
            "ok"
        );


        render();


    } catch(error) {

        console.error(
            "LOAD ERROR:",
            error
        );


        /*
           Jangan hapus data lama.
           Jika koneksi gagal sesaat,
           data terakhir tetap ditampilkan.
        */

        if (semuaAntrean.length > 0) {

            setConnection(
                "Sinkronisasi tertunda — menampilkan data terakhir",
                "error"
            );

        } else {

            setConnection(
                "Belum dapat terhubung ke server",
                "error"
            );

        }

    } finally {

        sedangLoad = false;

    }
}


/* =====================================================
   ACTION HELPER
===================================================== */

async function jalankanAction(
    params,
    successMessage = ""
) {

    if (sedangProses) return;

    sedangProses = true;

    try {

        const hasil =
            await panggilAPI(params);


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Perintah gagal."
            );

            return false;
        }


        if (successMessage) {

            alert(successMessage);

        }


        await muatData();

        return true;


    } catch(error) {

        console.error(
            "ACTION ERROR:",
            error
        );

        alert(
            "Tidak dapat terhubung ke server.\n\n" +
            "Coba lagi beberapa detik."
        );

        return false;


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   PANGGIL ANTREAN
===================================================== */

async function panggilAntrean(game) {

    if (sedangProses) return;


    const waiting =
        semuaAntrean.filter(
            item =>
                item.game === game &&
                item.status === "WAITING"
        );


    /*
       Jika dari data lokal memang tidak ada,
       tetap kirim request ke server karena
       server adalah sumber data utama.
    */

    if (waiting.length === 0) {

        const lanjut =
            confirm(
                "Belum terlihat antrean " +
                game +
                " di layar.\n\n" +
                "Tetap minta server memanggil antrean berikutnya?"
            );

        if (!lanjut) return;

    } else {

        const lanjut =
            confirm(
                "Panggil antrean berikutnya untuk " +
                game +
                "?"
            );

        if (!lanjut) return;

    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({
                action: "call",
                game: game
            });


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Tidak ada antrean yang dapat dipanggil."
            );

            return;
        }


        alert(
            "📣 ANTREAN DIPANGGIL\n\n" +
            (hasil.queueId || "") +
            "\n" +
            (hasil.customer || "")
        );


        await muatData();


    } catch(error) {

        console.error(
            "CALL ERROR:",
            error
        );

        alert(
            "Gagal memanggil antrean.\n\n" +
            "Periksa koneksi lalu coba lagi."
        );


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   MULAI SESI
===================================================== */

async function mulaiSesi(queueId) {

    if (sedangProses) return;


    const durasiInput =
        prompt(
            "Masukkan durasi bermain dalam menit:",
            "60"
        );


    if (durasiInput === null) {
        return;
    }


    const durasi =
        parseInt(
            durasiInput,
            10
        );


    if (
        !Number.isFinite(durasi) ||
        durasi < 1 ||
        durasi > 1440
    ) {

        alert(
            "Durasi tidak valid.\n\n" +
            "Masukkan angka 1 sampai 1440 menit."
        );

        return;
    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({
                action: "mulai",
                queueId: queueId,
                durasi: durasi
            });


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Gagal memulai sesi."
            );

            return;
        }


        await muatData();


    } catch(error) {

        console.error(
            "START ERROR:",
            error
        );

        alert(
            "Gagal memulai sesi."
        );


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   UBAH DURASI
===================================================== */

async function ubahDurasi(
    queueId,
    delta
) {

    if (sedangProses) return;


    const teks =
        delta > 0
        ? "Tambah 30 menit?"
        : "Kurangi 30 menit?";


    if (!confirm(teks)) {
        return;
    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({
                action: "ubahDurasi",
                queueId: queueId,
                delta: delta
            });


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Gagal mengubah durasi."
            );

            return;
        }


        await muatData();


    } catch(error) {

        console.error(
            "DURATION ERROR:",
            error
        );

        alert(
            "Gagal mengubah durasi."
        );


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   SELESAI
===================================================== */

async function selesaikan(queueId) {

    if (sedangProses) return;


    if (
        !confirm(
            "Yakin sesi " +
            queueId +
            " sudah selesai?"
        )
    ) {

        return;
    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({
                action: "done",
                queueId: queueId
            });


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Gagal menyelesaikan sesi."
            );

            return;
        }


        await muatData();


    } catch(error) {

        console.error(
            "DONE ERROR:",
            error
        );

        alert(
            "Gagal menyelesaikan sesi."
        );


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   HAPUS / BATALKAN
===================================================== */

async function hapus(queueId) {

    if (sedangProses) return;


    if (
        !confirm(
            "Batalkan antrean " +
            queueId +
            "?"
        )
    ) {

        return;
    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({
                action: "delete",
                queueId: queueId
            });


        if (!hasil ||
            hasil.success !== true) {

            alert(
                hasil?.message ||
                "Gagal membatalkan antrean."
            );

            return;
        }


        await muatData();


    } catch(error) {

        console.error(
            "DELETE ERROR:",
            error
        );

        alert(
            "Gagal membatalkan antrean."
        );


    } finally {

        sedangProses = false;

    }
}


/* =====================================================
   TIMESTAMP
===================================================== */

function timestampKeMs(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return NaN;
    }


    /*
       Jika sudah berupa angka
    */

    if (
        typeof value === "number" &&
        Number.isFinite(value)
    ) {

        /*
           Jika timestamp dalam detik
        */

        if (value < 10000000000) {

            return value * 1000;

        }

        return value;
    }


    /*
       Jika string angka
    */

    const angka =
        Number(value);


    if (Number.isFinite(angka)) {

        if (angka < 10000000000) {

            return angka * 1000;

        }

        return angka;
    }


    /*
       Jika ISO date/string tanggal
    */

    const parsed =
        Date.parse(value);


    return parsed;
}


/* =====================================================
   HITUNG SISA WAKTU
===================================================== */

function hitungSisa(item) {

    if (
        !item.mulaiMain ||
        !item.durasiMenit
    ) {

        return null;
    }


    const mulai =
        timestampKeMs(
            item.mulaiMain
        );


    const durasi =
        Number(
            item.durasiMenit
        );


    if (
        !Number.isFinite(mulai) ||
        !Number.isFinite(durasi) ||
        durasi <= 0
    ) {

        return null;
    }


    const totalDetik =
        durasi * 60;


    const berlalu =
        Math.floor(
            (
                Date.now() -
                mulai
            ) / 1000
        );


    return (
        totalDetik -
        berlalu
    );
}


/* =====================================================
   FORMAT TIMER
===================================================== */

function formatTimer(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const jam =
        Math.floor(
            seconds / 3600
        );


    const menit =
        Math.floor(
            (seconds % 3600) / 60
        );


    const detik =
        seconds % 60;


    if (jam > 0) {

        return (
            String(jam).padStart(2,"0") +
            ":" +
            String(menit).padStart(2,"0") +
            ":" +
            String(detik).padStart(2,"0")
        );
    }


    return (
        String(menit).padStart(2,"0") +
        ":" +
        String(detik).padStart(2,"0")
    );
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function aman(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }


    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   RENDER SEMUA
===================================================== */

function render() {

    renderStats();

    renderGameSummary();

    renderQueue();

}


/* =====================================================
   STATS
===================================================== */

function renderStats() {

    const playing =
        semuaAntrean.filter(
            item =>
                item.status === "PLAYING"
        );


    const waiting =
        semuaAntrean.filter(
            item =>
                item.status === "WAITING"
        );


    let hampirHabis = 0;

    let habis = 0;


    playing.forEach(
        item => {

            const sisa =
                hitungSisa(item);


            if (sisa === null) {
                return;
            }


            if (sisa <= 0) {

                habis++;

            } else if (
                sisa <= 600
            ) {

                hampirHabis++;

            }

        }
    );


    document.getElementById(
        "jumlahPlaying"
    ).textContent =
        playing.length;


    document.getElementById(
        "jumlahWaiting"
    ).textContent =
        waiting.length;


    document.getElementById(
        "jumlahHampirHabis"
    ).textContent =
        hampirHabis;


    document.getElementById(
        "jumlahHabis"
    ).textContent =
        habis;
}


/* =====================================================
   GAME SUMMARY
===================================================== */

function renderGameSummary() {

    const container =
        document.getElementById(
            "gameSummary"
        );


    let html = "";


    GAMES.forEach(
        game => {

            const waiting =
                semuaAntrean.filter(
                    item =>
                        item.game === game &&
                        item.status === "WAITING"
                ).length;


            const playing =
                semuaAntrean.filter(
                    item =>
                        item.game === game &&
                        item.status === "PLAYING"
                ).length;


            html += `

                <div class="game-box">

                    <div class="game-name">
                        ${aman(game)}
                    </div>

                    <div class="game-count">
                        🟡 ${waiting} menunggu
                    </div>

                    <div class="game-count">
                        🟢 ${playing} bermain
                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;
}


/* =====================================================
   RENDER QUEUE
===================================================== */

function renderQueue() {

    const container =
        document.getElementById(
            "queueList"
        );


    if (
        !Array.isArray(
            semuaAntrean
        ) ||
        semuaAntrean.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                🎫 Belum ada antrean aktif.

            </div>

        `;

        return;
    }


    /*
       Urutan:
       1. PLAYING
       2. WAITING
    */

    const data =
        [...semuaAntrean].sort(
            (a,b) => {

                if (
                    a.status === "PLAYING" &&
                    b.status !== "PLAYING"
                ) {

                    return -1;
                }


                if (
                    a.status !== "PLAYING" &&
                    b.status === "PLAYING"
                ) {

                    return 1;
                }


                return 0;
            }
        );


    let html = "";


    data.forEach(
        item => {

            const isPlaying =
                item.status === "PLAYING";


            const sisa =
                hitungSisa(item);


            const expired =
                isPlaying &&
                sisa !== null &&
                sisa <= 0;


            let cardClass =
                "queue-card";


            if (isPlaying) {

                cardClass +=
                    " playing";
            }


            if (expired) {

                cardClass +=
                    " expired";
            }


            /* =========================
               STATUS LABEL
            ========================= */

            let statusClass =
                "waiting";


            let statusText =
                "🟡 MENUNGGU";


            if (isPlaying) {

                if (
                    !item.mulaiMain
                ) {

                    statusClass =
                        "called";

                    statusText =
                        "📣 DIPANGGIL";

                } else if (
                    expired
                ) {

                    statusClass =
                        "expired";

                    statusText =
                        "🔴 WAKTU HABIS";

                } else {

                    statusClass =
                        "playing";

                    statusText =
                        "🟢 SEDANG MAIN";
                }
            }


            html += `

                <div class="${cardClass}">

                    <div class="queue-top">

                        <div>

                            <div class="queue-id">
                                ${aman(item.queueId)}
                            </div>

                            <div class="customer">
                                👤
                                ${aman(item.customer)}
                                —
                                ${aman(item.players)}
                                pemain
                            </div>

                            <div class="game">
                                🎮
                                ${aman(item.game)}
                            </div>

                        </div>


                        <div>

                            <span
                                class="status ${statusClass}"
                            >
                                ${statusText}
                            </span>

                        </div>

                    </div>

            `;


            /* =========================
               TIMER
            ========================= */

            if (
                isPlaying &&
                item.mulaiMain &&
                item.durasiMenit &&
                sisa !== null
            ) {

                let timerClass =
                    "timer";


                if (
                    sisa <= 600 &&
                    sisa > 0
                ) {

                    timerClass +=
                        " warning";
                }


                if (
                    sisa <= 0
                ) {

                    timerClass +=
                        " expired";
                }


                html += `

                    <div
                        class="${timerClass}"
                    >

                        ${
                            sisa <= 0
                            ? "WAKTU HABIS"
                            : formatTimer(sisa)
                        }

                    </div>

                    <div
                        class="info"
                        style="text-align:center"
                    >

                        Durasi:
                        ${aman(item.durasiMenit)}
                        menit

                        ${
                            sisa <= 600 &&
                            sisa > 0
                            ? "<br>⚠️ Waktu hampir habis"
                            : ""
                        }

                    </div>

                `;


            } else if (
                isPlaying &&
                !item.mulaiMain
            ) {

                html += `

                    <div class="info">

                        📣 Customer sudah dipanggil.

                        <br>

                        Tekan
                        <b>MULAI SESI</b>
                        untuk memulai timer.

                    </div>

                `;

            }


            /* =========================
               BUTTONS
            ========================= */

            html += `

                <div class="buttons">

            `;


            /* WAITING */

            if (
                item.status === "WAITING"
            ) {

                html += `

                    <button
                        class="btn-call"
                        onclick="panggilAntrean(
                            '${aman(item.game)}'
                        )"
                    >

                        📣 PANGGIL
                        ${aman(item.game)}

                    </button>


                    <button
                        class="btn-delete"
                        onclick="hapus(
                            '${aman(item.queueId)}'
                        )"
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }


            /* CALLED */

            if (
                item.status === "PLAYING" &&
                !item.mulaiMain
            ) {

                html += `

                    <button
                        class="btn-start"
                        onclick="mulaiSesi(
                            '${aman(item.queueId)}'
                        )"
                    >

                        ▶️ MULAI SESI

                    </button>


                    <button
                        class="btn-delete"
                        onclick="hapus(
                            '${aman(item.queueId)}'
                        )"
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }


            /* PLAYING */

            if (
                item.status === "PLAYING" &&
                item.mulaiMain
            ) {

                html += `

                    <button
                        class="btn-add"
                        onclick="ubahDurasi(
                            '${aman(item.queueId)}',
                            30
                        )"
                    >

                        ➕ +30 MENIT

                    </button>


                    <button
                        class="btn-minus"
                        onclick="ubahDurasi(
                            '${aman(item.queueId)}',
                            -30
                        )"
                    >

                        ➖ -30 MENIT

                    </button>


                    <button
                        class="btn-done"
                        onclick="selesaikan(
                            '${aman(item.queueId)}'
                        )"
                    >

                        ✅ SELESAI

                    </button>


                    <button
                        class="btn-refresh"
                        onclick="muatData()"
                    >

                        🔄 REFRESH

                    </button>

                `;

            }


            html += `

                </div>

            </div>

            `;

        }
    );


    container.innerHTML =
        html;
}


/* =====================================================
   INITIAL LOAD
===================================================== */

muatData();


/* =====================================================
   SERVER SYNC
   5 DETIK
===================================================== */

setInterval(
    muatData,
    5000
);


/* =====================================================
   TIMER REFRESH
   1 DETIK
===================================================== */

setInterval(
    () => {

        if (
            semuaAntrean.length > 0
        ) {

            render();

        }

    },
    1000
);


/* =====================================================
   VISIBILITY
   Jika kembali ke tab/browser,
   langsung sinkronisasi.
===================================================== */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.visibilityState ===
            "visible"
        ) {

            muatData();

        }

    }
);

</script>

</body>
