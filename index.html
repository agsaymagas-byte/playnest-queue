<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>PLAYNEST CONTROL</title>


<style>

/* =========================
   ROOT
========================= */

:root {

    --bg: #090314;

    --surface: #120720;

    --surface2: #190b2d;

    --purple: #8b5cf6;

    --purple2: #c084fc;

    --green: #4ade80;

    --yellow: #facc15;

    --red: #f87171;

    --text: #f5efff;

    --muted: #a99bd1;

}


/* =========================
   RESET
========================= */

* {

    box-sizing: border-box;

}


html {

    scroll-behavior: smooth;

}


body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #24103f 0%,
            #090314 55%,
            #050208 100%
        );

    color: var(--text);

    font-family: Arial, sans-serif;

    padding: 30px 16px 70px;

}


/* =========================
   CONTAINER
========================= */

.container {

    max-width: 1100px;

    margin: auto;

}


/* =========================
   HEADER
========================= */

header {

    text-align: center;

    margin-bottom: 30px;

}


.logo {

    font-size: 14px;

    letter-spacing: 7px;

    color: var(--purple2);

    margin-bottom: 10px;

}


h1 {

    margin: 0;

    font-size: 34px;

    letter-spacing: 6px;

    font-weight: 800;

}


.subtitle {

    color: var(--muted);

    letter-spacing: 3px;

    font-size: 12px;

    margin-top: 8px;

}


#connection {

    margin-top: 16px;

    color: var(--muted);

    font-size: 13px;

}


#connection.error {

    color: var(--red);

}


/* =========================
   STATISTICS
========================= */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 30px;

}


.stat {

    background:
        rgba(18,7,32,.85);

    border:
        1px solid
        rgba(192,132,252,.12);

    border-radius: 18px;

    padding: 18px 10px;

    text-align: center;

}


.stat-number {

    font-size: 32px;

    font-weight: 800;

    color: var(--purple2);

}


.stat-label {

    margin-top: 5px;

    color: var(--muted);

    font-size: 11px;

    letter-spacing: 1.5px;

}


/* =========================
   SECTION
========================= */

.section-title {

    text-align: center;

    color: var(--purple2);

    font-size: 14px;

    letter-spacing: 3px;

    margin: 35px 0 18px;

}


/* =========================
   GAME SUMMARY
========================= */

.game-summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

}


.game-box {

    background:
        rgba(18,7,32,.7);

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius: 14px;

    padding: 14px 8px;

    text-align: center;

}


.game-name {

    font-weight: bold;

    margin-bottom: 6px;

}


.game-count {

    color: var(--muted);

    font-size: 12px;

    margin-top: 3px;

}


/* =========================
   QUEUE LIST
========================= */

.queue-list {

    display: grid;

    gap: 14px;

}


.queue-card {

    background:
        linear-gradient(
            145deg,
            var(--surface2),
            var(--surface)
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    border-left:
        4px solid
        var(--yellow);

    border-radius: 18px;

    padding: 20px;

    transition:
        transform .15s ease,
        box-shadow .15s ease;

}


.queue-card.playing {

    border-left-color:
        var(--green);

    box-shadow:
        0 0 25px
        rgba(74,222,128,.08);

}


.queue-card:hover {

    transform:
        translateY(-1px);

}


/* =========================
   QUEUE TOP
========================= */

.queue-top {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    align-items: flex-start;

}


.queue-id {

    font-family:
        Consolas,
        monospace;

    font-size: 25px;

    font-weight: bold;

    color: var(--purple2);

}


.customer {

    margin-top: 5px;

    font-size: 15px;

}


.game {

    margin-top: 5px;

    color: var(--muted);

    font-size: 13px;

}


/* =========================
   STATUS
========================= */

.status {

    display: inline-block;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: .5px;

}


.status.waiting {

    background:
        rgba(250,204,21,.12);

    color:
        var(--yellow);

}


.status.playing {

    background:
        rgba(74,222,128,.12);

    color:
        var(--green);

}


/* =========================
   TIMER
========================= */

.timer {

    text-align: center;

    font-family:
        Consolas,
        monospace;

    font-size: 40px;

    font-weight: bold;

    margin: 18px 0;

    color:
        var(--green);

}


.timer.warning {

    color:
        var(--yellow);

}


.timer.expired {

    color:
        var(--red);

}


.info {

    color:
        var(--muted);

    font-size: 13px;

    margin-top: 12px;

}


/* =========================
   BUTTONS
========================= */

.buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 18px;

}


button {

    border: none;

    border-radius: 10px;

    padding: 11px 15px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 13px;

    transition:
        transform .12s ease,
        opacity .12s ease;

}


button:hover {

    transform:
        translateY(-1px);

}


button:active {

    transform:
        scale(.98);

}


button:disabled {

    opacity: .45;

    cursor: not-allowed;

}


/* =========================
   BUTTON COLORS
========================= */

.btn-call {

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

}


.btn-start {

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

}


.btn-add {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6d28d9
        );

}


.btn-minus {

    background:
        linear-gradient(
            135deg,
            #4b5563,
            #374151
        );

}


.btn-done {

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #166534
        );

}


.btn-delete {

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );

}


.btn-refresh {

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #4338ca
        );

}


/* =========================
   EMPTY
========================= */

.empty {

    text-align: center;

    color:
        var(--muted);

    padding:
        35px 10px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    body {

        padding:
            20px 12px 50px;

    }


    h1 {

        font-size:
            25px;

        letter-spacing:
            4px;

    }


    .subtitle {

        font-size:
            10px;

        letter-spacing:
            2px;

    }


    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .game-summary {

        grid-template-columns:
            repeat(2, 1fr);

    }


    .queue-top {

        flex-direction:
            column;

    }


    .timer {

        font-size:
            34px;

    }


    button {

        flex:
            1;

        min-width:
            90px;

    }

}


/* =========================
   VERY SMALL PHONE
========================= */

@media(max-width:380px) {

    body {

        padding-left:
            9px;

        padding-right:
            9px;

    }


    h1 {

        font-size:
            22px;

    }


    .stat-number {

        font-size:
            28px;

    }


    .queue-id {

        font-size:
            22px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">
        PLAYNEST
    </div>


    <h1>
        PLAYNEST CONTROL
    </h1>


    <div class="subtitle">
        DASHBOARD CAPTAIN — LIVE MONITORING
    </div>


    <div id="connection">
        Menghubungkan ke server...
    </div>

</header>



<!-- =========================
     STATISTIK
========================= -->

<div class="stats">


    <div class="stat">

        <div
            class="stat-number"
            id="jumlahPlaying"
        >
            0
        </div>

        <div class="stat-label">
            SEDANG MAIN
        </div>

    </div>



    <div class="stat">

        <div
            class="stat-number"
            id="jumlahWaiting"
        >
            0
        </div>

        <div class="stat-label">
            MENUNGGU
        </div>

    </div>



    <div class="stat">

        <div
            class="stat-number"
            id="jumlahHampirHabis"
        >
            0
        </div>

        <div class="stat-label">
            HAMPIR HABIS
        </div>

    </div>



    <div class="stat">

        <div
            class="stat-number"
            id="jumlahHabis"
        >
            0
        </div>

        <div class="stat-label">
            WAKTU HABIS
        </div>

    </div>


</div>



<!-- =========================
     STATUS GAME
========================= -->

<div class="section-title">

    🎮 STATUS GAME

</div>


<div
    class="game-summary"
    id="gameSummary"
>
</div>



<!-- =========================
     SEMUA ANTREAN
========================= -->

<div class="section-title">

    🎫 SEMUA ANTREAN

</div>


<div
    id="queueList"
    class="queue-list"
>

    <div class="empty">

        Memuat data...

    </div>

</div>


</div>



<script>


/* =====================================================
   CONFIGURATION
===================================================== */


const API_URL =
"https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";


const GAMES = [

    "PS5",

    "PS4",

    "Nintendo",

    "Racing"

];


let semuaAntrean = [];

let sedangProses = false;



/* =====================================================
   API
===================================================== */


async function panggilAPI(params) {

    params._ts =
        Date.now();


    const url =
        API_URL +
        "?" +
        new URLSearchParams(params).toString();


    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP Error " +
            response.status
        );

    }


    const data =
        await response.json();


    return data;

}



/* =====================================================
   LOAD DATA
===================================================== */


async function muatData() {

    try {

        const hasil =
            await panggilAPI({

                action: "list"

            });


        if (
            !hasil ||
            !hasil.success
        ) {

            tampilkanError(
                hasil
                ? hasil.message
                : "Server tidak memberikan data."
            );

            return;

        }


        semuaAntrean =
            Array.isArray(hasil.data)
            ? hasil.data
            : [];


        const connection =
            document.getElementById(
                "connection"
            );


        connection.textContent =
            "Terhubung — data tersinkron • " +
            new Date()
                .toLocaleTimeString(
                    "id-ID"
                );


        connection.classList.remove(
            "error"
        );


        render();


    } catch(error) {

        tampilkanError(
            error.message ||
            error.toString()
        );

    }

}



/* =====================================================
   ERROR
===================================================== */


function tampilkanError(message) {

    const el =
        document.getElementById(
            "connection"
        );


    el.textContent =
        "Gagal terhubung ke server";


    el.classList.add(
        "error"
    );


    console.error(
        "PLAYNEST ERROR:",
        message
    );

}



/* =====================================================
   PANGGIL ANTREAN
===================================================== */


async function panggilAntrean(game) {

    if (sedangProses)
        return;


    if (!game) {

        alert(
            "Game tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(
            "📣 Panggil antrean berikutnya untuk " +
            game +
            "?"
        );


    if (!yakin)
        return;


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({

                action: "call",

                game: String(game).trim()

            });


        if (
            !hasil ||
            !hasil.success
        ) {

            alert(
                hasil &&
                hasil.message
                ? hasil.message
                : "Gagal memanggil antrean."
            );

            return;

        }


        alert(
            "📣 ANTREAN DIPANGGIL!\n\n" +

            String(
                hasil.queueId || ""
            ) +

            "\n" +

            String(
                hasil.customer || ""
            )
        );


        await muatData();


    } catch(error) {

        console.error(
            "CALL ERROR:",
            error
        );


        alert(
            "❌ Terjadi kesalahan saat memanggil antrean."
        );


    } finally {

        sedangProses = false;

    }

}



/* =====================================================
   MULAI SESI
===================================================== */


async function mulaiSesi(queueId) {

    if (sedangProses)
        return;


    if (!queueId) {

        alert(
            "ID antrean tidak ditemukan."
        );

        return;

    }


    const durasi =
        prompt(
            "Masukkan durasi bermain dalam menit:",
            "60"
        );


    if (durasi === null)
        return;


    const angka =
        parseInt(
            String(durasi).trim(),
            10
        );


    if (
        !Number.isFinite(angka) ||
        angka < 1
    ) {

        alert(
            "Durasi tidak valid."
        );

        return;

    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({

                action: "mulai",

                queueId:
                    String(queueId).trim(),

                durasi:
                    angka

            });


        if (
            !hasil ||
            !hasil.success
        ) {

            alert(
                hasil &&
                hasil.message
                ? hasil.message
                : "Gagal memulai sesi."
            );

            return;

        }


        await muatData();


    } catch(error) {

        console.error(
            "START ERROR:",
            error
        );


        alert(
            "❌ Gagal memulai sesi."
        );


    } finally {

        sedangProses = false;

    }

}



/* =====================================================
   UBAH DURASI
===================================================== */


async function ubahDurasi(
    queueId,
    delta
) {

    if (sedangProses)
        return;


    if (!queueId) {

        alert(
            "ID antrean tidak ditemukan."
        );

        return;

    }


    const perubahan =
        Number(delta);


    if (
        !Number.isFinite(perubahan) ||
        perubahan === 0
    ) {

        alert(
            "Perubahan durasi tidak valid."
        );

        return;

    }


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({

                action:
                    "ubahDurasi",

                queueId:
                    String(queueId).trim(),

                delta:
                    perubahan

            });


        if (
            !hasil ||
            !hasil.success
        ) {

            alert(
                hasil &&
                hasil.message
                ? hasil.message
                : "Gagal mengubah durasi."
            );

            return;

        }


        await muatData();


    } catch(error) {

        console.error(
            "DURATION ERROR:",
            error
        );


        alert(
            "❌ Gagal mengubah durasi."
        );


    } finally {

        sedangProses = false;

    }

}



/* =====================================================
   SELESAI
===================================================== */


async function selesaikan(queueId) {

    if (sedangProses)
        return;


    if (!queueId) {

        alert(
            "ID antrean tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(
            "✅ Yakin sesi " +
            queueId +
            " sudah selesai?"
        );


    if (!yakin)
        return;


    sedangProses = true;


    try {

        const hasil =
            await panggilAPI({

                action: "done",

                queueId:
                    String(queueId).trim()

            });


        if (
            !hasil ||
            !hasil.success
        ) {

            alert(
                hasil &&
                hasil.message
                ? hasil.message
                : "Gagal menyelesaikan sesi."
            );

            return;

        }


        await muatData();


    } catch(error) {

        console.error(
            "DONE ERROR:",
            error
        );


        alert(
            "❌ Gagal menyelesaikan sesi."
        );


    } finally {

        sedangProses = false;

    }

}



/* =====================================================
   DELETE / BATALKAN ANTREAN
===================================================== */


async function hapus(queueId) {

    if (sedangProses)
        return;


    /* Pastikan ID tersedia */

    if (!queueId) {

        alert(
            "❌ ID antrean tidak ditemukan."
        );

        return;

    }


    /* Bersihkan spasi */

    const id =
        String(queueId).trim();


    if (!id) {

        alert(
            "❌ ID antrean kosong."
        );

        return;

    }


    /* Konfirmasi */

    const yakin =
        confirm(

            "⚠️ BATALKAN ANTREAN\n\n" +

            "Antrean: " +
            id +

            "\n\n" +

            "Yakin ingin membatalkan antrean ini?"

        );


    if (!yakin)
        return;


    sedangProses = true;


    try {

        console.log(
            "Menghapus antrean:",
            id
        );


        const hasil =
            await panggilAPI({

                action:
                    "delete",

                queueId:
                    id

            });


        console.log(
            "HASIL DELETE:",
            hasil
        );


        if (
            !hasil ||
            !hasil.success
        ) {

            alert(

                "❌ Gagal membatalkan antrean.\n\n" +

                (
                    hasil &&
                    hasil.message
                    ? hasil.message
                    : "Server tidak memberikan respons yang benar."
                )

            );

            return;

        }


        alert(

            "✅ Antrean " +
            id +
            " berhasil dibatalkan."

        );


        /* Ambil ulang data */

        await muatData();


    } catch(error) {

        console.error(
            "DELETE ERROR:",
            error
        );


        alert(

            "❌ Terjadi kesalahan saat membatalkan antrean.\n\n" +

            "Silakan coba lagi."

        );


    } finally {

        sedangProses = false;

    }

}



/* =====================================================
   TIMER
===================================================== */


function hitungSisa(item) {

    if (
        !item ||
        !item.mulaiMain ||
        !item.durasiMenit
    ) {

        return null;

    }


    const total =
        Number(item.durasiMenit) *
        60;


    const waktuMulai =
        Number(item.mulaiMain);


    if (
        !Number.isFinite(waktuMulai)
    ) {

        return null;

    }


    const berlalu =
        Math.floor(

            (
                Date.now() -
                waktuMulai
            ) / 1000

        );


    return (
        total -
        berlalu
    );

}



/* =====================================================
   FORMAT TIMER
===================================================== */


function formatTimer(seconds) {

    seconds =
        Math.max(
            0,
            Math.floor(
                Number(seconds) || 0
            )
        );


    const menit =
        Math.floor(
            seconds / 60
        );


    const detik =
        seconds % 60;


    return (

        String(menit)
            .padStart(2, "0")

        +

        ":" +

        String(detik)
            .padStart(2, "0")

    );

}



/* =====================================================
   RENDER
===================================================== */


function render() {

    renderStats();

    renderGameSummary();

    renderQueue();

}



/* =====================================================
   STATISTICS
===================================================== */


function renderStats() {

    const playing =
        semuaAntrean.filter(
            x =>
                x.status ===
                "PLAYING"
        );


    const waiting =
        semuaAntrean.filter(
            x =>
                x.status ===
                "WAITING"
        );


    let hampirHabis = 0;

    let habis = 0;


    playing.forEach(
        item => {

            const sisa =
                hitungSisa(item);


            if (
                sisa !== null
            ) {

                if (
                    sisa <= 0
                ) {

                    habis++;

                }

                else if (
                    sisa <= 600
                ) {

                    hampirHabis++;

                }

            }

        }
    );


    document.getElementById(
        "jumlahPlaying"
    ).textContent =
        playing.length;


    document.getElementById(
        "jumlahWaiting"
    ).textContent =
        waiting.length;


    document.getElementById(
        "jumlahHampirHabis"
    ).textContent =
        hampirHabis;


    document.getElementById(
        "jumlahHabis"
    ).textContent =
        habis;

}



/* =====================================================
   GAME SUMMARY
===================================================== */


function renderGameSummary() {

    const container =
        document.getElementById(
            "gameSummary"
        );


    let html = "";


    GAMES.forEach(
        game => {

            const waiting =
                semuaAntrean.filter(

                    x =>
                        x.game === game &&
                        x.status ===
                        "WAITING"

                ).length;


            const playing =
                semuaAntrean.filter(

                    x =>
                        x.game === game &&
                        x.status ===
                        "PLAYING"

                ).length;


            const adaWaiting =
                waiting > 0;


            html += `

                <div class="game-box">

                    <div class="game-name">
                        🎮 ${game}
                    </div>

                    <div class="game-count">
                        🟡 ${waiting} menunggu
                    </div>

                    <div class="game-count">
                        🟢 ${playing} bermain
                    </div>

                    <div
                        class="buttons"
                        style="margin-top:12px"
                    >

                        <button
                            class="btn-call"
                            ${adaWaiting ? "" : "disabled"}
                            onclick='panggilAntrean(${JSON.stringify(game)})'
                        >

                            📣 PANGGIL ANTREAN

                        </button>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}



/* =====================================================
   RENDER QUEUE
===================================================== */


function renderQueue() {

    const container =
        document.getElementById(
            "queueList"
        );


    if (
        semuaAntrean.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Belum ada antrean aktif.

            </div>

        `;

        return;

    }


    /*
        PLAYING terlebih dahulu.
        WAITING setelahnya.
    */


    const data =
        [...semuaAntrean].sort(

            (a, b) => {

                if (

                    a.status ===
                    "PLAYING"

                    &&

                    b.status !==
                    "PLAYING"

                ) {

                    return -1;

                }


                if (

                    a.status !==
                    "PLAYING"

                    &&

                    b.status ===
                    "PLAYING"

                ) {

                    return 1;

                }


                return 0;

            }

        );


    let html = "";


    data.forEach(
        item => {


            const isPlaying =
                item.status ===
                "PLAYING";


            const sisa =
                hitungSisa(item);


            const queueId =
                String(
                    item.queueId || ""
                ).trim();


            const game =
                String(
                    item.game || ""
                );


            const customer =
                String(
                    item.customer || ""
                );


            const players =
                String(
                    item.players || 0
                );


            let cardClass =
                isPlaying
                ? "queue-card playing"
                : "queue-card";


            html += `

                <div
                    class="${cardClass}"
                >

                    <div
                        class="queue-top"
                    >

                        <div>

                            <div
                                class="queue-id"
                            >
                                ${queueId}
                            </div>


                            <div
                                class="customer"
                            >
                                👤
                                ${customer}
                                —
                                ${players}
                                pemain
                            </div>


                            <div
                                class="game"
                            >
                                🎮
                                ${game}
                            </div>

                        </div>


                        <div>

                            <span
                                class="status ${
                                    isPlaying
                                    ? "playing"
                                    : "waiting"
                                }"
                            >

                                ${
                                    isPlaying
                                    ? "🟢 PLAYING"
                                    : "🟡 WAITING"
                                }

                            </span>

                        </div>

                    </div>

            `;



            /* =========================
               TIMER
            ========================= */


            if (

                isPlaying &&

                item.mulaiMain &&

                item.durasiMenit

            ) {


                let timerClass =
                    "timer";


                if (

                    sisa <= 600 &&

                    sisa > 0

                ) {

                    timerClass +=
                        " warning";

                }


                if (
                    sisa <= 0
                ) {

                    timerClass +=
                        " expired";

                }


                html += `

                    <div
                        class="${timerClass}"
                    >

                        ${
                            sisa <= 0
                            ? "WAKTU HABIS"
                            : formatTimer(sisa)
                        }

                    </div>


                    <div
                        class="info"
                        style="text-align:center"
                    >

                        Durasi:
                        ${item.durasiMenit}
                        menit

                    </div>

                `;


            }

            else if (
                isPlaying
            ) {

                html += `

                    <div
                        class="info"
                    >

                        ⚠️ Antrean sudah dipanggil.

                        Silakan tekan

                        <b>
                            MULAI SESI
                        </b>.

                    </div>

                `;

            }



            /* =========================
               BUTTON AREA
            ========================= */


            html += `

                <div
                    class="buttons"
                >

            `;



            /* =========================
               WAITING
            ========================= */


            if (
                item.status ===
                "WAITING"
            ) {

                html += `

                    <button
                        class="btn-call"
                        onclick='panggilAntrean(${JSON.stringify(game)})'
                    >

                        📣 PANGGIL

                    </button>


                    <button
                        class="btn-delete"
                        onclick='hapus(${JSON.stringify(queueId)})'
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }



            /* =========================
               PLAYING BELUM DIMULAI
            ========================= */


            if (

                item.status ===
                "PLAYING"

                &&

                !item.mulaiMain

            ) {

                html += `

                    <button
                        class="btn-start"
                        onclick='mulaiSesi(${JSON.stringify(queueId)})'
                    >

                        ▶️ MULAI SESI

                    </button>


                    <button
                        class="btn-delete"
                        onclick='hapus(${JSON.stringify(queueId)})'
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }



            /* =========================
               PLAYING AKTIF
            ========================= */


            if (

                item.status ===
                "PLAYING"

                &&

                item.mulaiMain

            ) {

                html += `

                    <button
                        class="btn-add"
                        onclick='ubahDurasi(${JSON.stringify(queueId)}, 30)'
                    >

                        +30 MENIT

                    </button>


                    <button
                        class="btn-minus"
                        onclick='ubahDurasi(${JSON.stringify(queueId)}, -30)'
                    >

                        -30 MENIT

                    </button>


                    <button
                        class="btn-done"
                        onclick='selesaikan(${JSON.stringify(queueId)})'
                    >

                        ✅ SELESAI

                    </button>

                `;

            }



            html += `

                </div>

            </div>

            `;

        }
    );


    container.innerHTML =
        html;

}



/* =====================================================
   INITIAL LOAD
===================================================== */


muatData();



/* =====================================================
   SERVER SYNC
   Setiap 3 detik
===================================================== */


setInterval(

    muatData,

    3000

);



/* =====================================================
   TIMER UPDATE
   Setiap 1 detik
===================================================== */


setInterval(

    () => {

        render();

    },

    1000

);


</script>


</body>

</html>
