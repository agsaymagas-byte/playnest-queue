<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEST Queue</title>

<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px 16px 60px;
        background-color: #f4f5f7;
        color: #1c1c1e;
    }

    h1 {
        font-size: 36px;
        margin-bottom: 4px;
        color: #111;
    }

    h2 {
        font-size: 24px;
        margin-top: 10px;
        color: #333;
    }

    h3 {
        font-size: 20px;
        margin: 24px 0 10px;
        color: #333;
    }

    p.sub {
        font-size: 16px;
        color: #666;
        margin-top: 0;
    }

    /* ===== STATUS SEDANG DIPANGGIL ===== */
    #panggilanBanner {
        max-width: 700px;
        margin: 20px auto;
        padding: 20px;
        border-radius: 16px;
        background: #e9ecef;
        transition: background 0.3s ease;
    }

    #panggilanBanner.aktif {
        background: linear-gradient(135deg, #2ecc71, #27ae60);
        color: white;
        animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
        70%  { box-shadow: 0 0 0 16px rgba(46, 204, 113, 0); }
        100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }

    #panggilanBanner .label {
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.85;
    }

    #panggilanBanner .nomorBesar {
        font-size: 40px;
        font-weight: bold;
        margin: 6px 0;
    }

    /* ===== GRID GAME ===== */
    .gameGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
        max-width: 900px;
        margin: 24px auto;
    }

    .gameCard {
        background: white;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        text-align: left;
    }

    .gameCard h4 {
        margin: 0 0 8px;
        font-size: 20px;
    }

    .gameCard .waiting-count {
        font-size: 13px;
        color: #888;
        margin-bottom: 10px;
    }

    .gameCard button {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .btnAmbil {
        background: #3498db;
        color: white;
    }

    .btnPanggil {
        background: #f39c12;
        color: white;
    }

    .antreanList {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
        font-size: 14px;
        max-height: 140px;
        overflow-y: auto;
    }

    .antreanList li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 8px;
        border-bottom: 1px solid #eee;
    }

    .antreanList li.playing {
        background: #eafaf1;
    }

    .badge {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: bold;
    }

    .badge.waiting { background: #fdecea; color: #c0392b; }
    .badge.playing { background: #eafaf1; color: #1e8449; }

    /* ===== ADMIN PANEL ===== */
    #adminSection {
        max-width: 900px;
        margin: 40px auto 0;
        background: white;
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    #adminToggle {
        background: #34495e;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        margin-bottom: 12px;
    }

    #adminPanelBody {
        display: none;
        text-align: left;
    }

    #adminPanelBody.show {
        display: block;
    }

    .adminRow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
        flex-wrap: wrap;
        gap: 6px;
    }

    .adminRow button {
        padding: 6px 12px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        color: white;
    }

    .btnHapus { background: #e74c3c; }
    .btnSelesai { background: #27ae60; }

    #resetAllBtn {
        margin-top: 14px;
        background: #c0392b;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
    }

    .empty-msg {
        color: #999;
        font-size: 14px;
        padding: 10px 0;
    }
</style>
</head>

<body>

<h1>PLAYNEST</h1>
<h2>Digital Queue System</h2>
<p class="sub">Selamat datang di PLAYNEST. Tersedia 4 jenis permainan.</p>

<!-- BANNER STATUS PANGGILAN -->
<div id="panggilanBanner">
    <div class="label">Status Panggilan</div>
    <div class="nomorBesar" id="panggilanNomor">Belum ada panggilan</div>
    <div id="panggilanCustomer"></div>
</div>

<!-- GRID PER GAME -->
<div class="gameGrid" id="gameGrid"></div>

<!-- ADMIN -->
<div id="adminSection">
    <button id="adminToggle" onclick="toggleAdmin()">🔧 Panel Admin</button>
    <div id="adminPanelBody">
        <h3>Semua Antrean</h3>
        <div id="adminList"></div>
        <button id="resetAllBtn" onclick="resetSemua()">Reset Semua Antrean</button>
    </div>
</div>

<script>
    const JENIS_GAME = ["PS5", "PS4", "Nintendo", "Racing"];
    const STORAGE_KEY = "playnest_queues_v2";

    // ==========================================
    // DATA: dimuat dari localStorage, atau default kosong
    // ==========================================
    function muatData() {
        let data = localStorage.getItem(STORAGE_KEY);
        if (data) {
            return JSON.parse(data);
        }
        // Struktur default: tiap game punya counter & list antrean
        let awal = {};
        JENIS_GAME.forEach(game => {
            awal[game] = {
                counter: 0,
                antrean: [] // { id, customer, players, status: 'WAITING' | 'PLAYING' }
            };
        });
        return awal;
    }

    function simpanData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = muatData();

    // ==========================================
    // AMBIL ANTREAN BARU
    // ==========================================
    function ambilAntrean(game) {
        let namaCustomer = prompt("Nama customer:", "");
        if (namaCustomer === null) return; // batal
        if (namaCustomer.trim() === "") namaCustomer = "Tanpa Nama";

        let jumlahPlayer = prompt("Jumlah pemain:", "1");
        if (jumlahPlayer === null) return;
        jumlahPlayer = parseInt(jumlahPlayer) || 1;

        state[game].counter += 1;
        let nomorUrut = String(state[game].counter).padStart(3, "0");
        let idAntrean = game.toUpperCase() + "-" + nomorUrut;

        state[game].antrean.push({
            id: idAntrean,
            customer: namaCustomer,
            players: jumlahPlayer,
            status: "WAITING"
        });

        simpanData();
        render();
    }

    // ==========================================
    // PANGGIL ANTREAN BERIKUTNYA (per game)
    // ==========================================
    function panggilAntrian(game) {
        let daftar = state[game].antrean;
        let berikutnya = daftar.find(item => item.status === "WAITING");

        if (!berikutnya) {
            alert("Tidak ada antrean menunggu untuk " + game + ".");
            return;
        }

        berikutnya.status = "PLAYING";
        simpanData();

        tampilkanBanner(berikutnya, game);
        render();
    }

    function tampilkanBanner(item, game) {
        let banner = document.getElementById("panggilanBanner");
        banner.classList.add("aktif");
        document.getElementById("panggilanNomor").innerText = item.id;
        document.getElementById("panggilanCustomer").innerText =
            item.customer + " — " + item.players + " pemain (" + game + ")";
    }

    // ==========================================
    // ADMIN: tandai selesai / hapus satu antrean
    // ==========================================
    function tandaiSelesai(game, id) {
        let daftar = state[game].antrean;
        state[game].antrean = daftar.filter(item => item.id !== id);
        simpanData();
        render();
    }

    function hapusAntrean(game, id) {
        if (!confirm("Hapus antrean " + id + "?")) return;
        state[game].antrean = state[game].antrean.filter(item => item.id !== id);
        simpanData();
        render();
    }

    function resetSemua() {
        if (!confirm("Reset SEMUA antrean & nomor urut? Tindakan ini tidak bisa dibatalkan.")) return;
        state = {};
        JENIS_GAME.forEach(game => {
            state[game] = { counter: 0, antrean: [] };
        });
        simpanData();
        document.getElementById("panggilanBanner").classList.remove("aktif");
        document.getElementById("panggilanNomor").innerText = "Belum ada panggilan";
        document.getElementById("panggilanCustomer").innerText = "";
        render();
    }

    function toggleAdmin() {
        document.getElementById("adminPanelBody").classList.toggle("show");
    }

    // ==========================================
    // RENDER TAMPILAN
    // ==========================================
    function render() {
        // --- Grid per game ---
        let grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        JENIS_GAME.forEach(game => {
            let data = state[game];
            let menunggu = data.antrean.filter(i => i.status === "WAITING");

            let card = document.createElement("div");
            card.className = "gameCard";

            let listHtml = "";
            if (data.antrean.length === 0) {
                listHtml = '<p class="empty-msg">Belum ada antrean</p>';
            } else {
                listHtml = '<ul class="antreanList">' +
                    data.antrean.map(item => {
                        let cls = item.status === "PLAYING" ? "playing" : "";
                        let badgeCls = item.status === "PLAYING" ? "playing" : "waiting";
                        return `<li class="${cls}">
                            <span>${item.id} — ${item.customer} (${item.players}p)</span>
                            <span class="badge ${badgeCls}">${item.status}</span>
                        </li>`;
                    }).join("") +
                    '</ul>';
            }

            card.innerHTML = `
                <h4>${game}</h4>
                <div class="waiting-count">${menunggu.length} menunggu</div>
                <button class="btnAmbil" onclick="ambilAntrean('${game}')">Ambil Antrean</button>
                <button class="btnPanggil" onclick="panggilAntrian('${game}')">Panggil Berikutnya</button>
                ${listHtml}
            `;

            grid.appendChild(card);
        });

        // --- Panel admin ---
        let adminList = document.getElementById("adminList");
        let semuaKosong = JENIS_GAME.every(g => state[g].antrean.length === 0);

        if (semuaKosong) {
            adminList.innerHTML = '<p class="empty-msg">Belum ada antrean sama sekali</p>';
        } else {
            adminList.innerHTML = JENIS_GAME.map(game => {
                if (state[game].antrean.length === 0) return "";
                return state[game].antrean.map(item => `
                    <div class="adminRow">
                        <span>${item.id} — ${item.customer} (${item.players}p) — <b>${item.status}</b></span>
                        <span>
                            <button class="btnSelesai" onclick="tandaiSelesai('${game}', '${item.id}')">Selesai</button>
                            <button class="btnHapus" onclick="hapusAntrean('${game}', '${item.id}')">Hapus</button>
                        </span>
                    </div>
                `).join("");
            }).join("");
        }
    }

    // Render pertama kali saat halaman dibuka
    render();
</script>

</body>
</html>
