<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEST — Kasir</title>

<style>
:root{
    --bg-deep:#120B23;
    --bg-surface:#1E1338;
    --bg-surface-2:#281a47;
    --accent:#7C3AED;
    --accent-glow:#C084FC;
    --text-main:#F3EEFF;
    --text-muted:#A99BD1;
    --ps5:#8B5CF6;
    --ps4:#6366F1;
    --nintendo:#D946EF;
    --racing:#22D3EE;
    --green:#22C55E;
    --yellow:#F59E0B;
    --red:#EF4444;
    --font:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --mono:Consolas,"Roboto Mono",Menlo,monospace;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    padding:30px 16px 70px;
    background:
        radial-gradient(ellipse at top,#1a0f35 0%,var(--bg-deep) 55%,#0a0616 100%);
    color:var(--text-main);
    font-family:var(--font);
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.logoMark{
    width:52px;
    height:52px;
    margin:0 auto 14px;
    position:relative;
}

.logoMark::before,
.logoMark::after{
    content:"";
    position:absolute;
    width:21px;
    height:21px;
    top:15px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%,var(--accent-glow),var(--accent) 70%);
    box-shadow:0 0 20px 3px rgba(124,58,237,.5);
}

.logoMark::before{left:3px;}
.logoMark::after{right:3px;}

.logoMark .bar{
    position:absolute;
    left:10px;
    right:10px;
    top:21px;
    height:11px;
    background:linear-gradient(135deg,var(--bg-surface-2),var(--bg-surface));
    border:1px solid rgba(192,132,252,.4);
    border-radius:8px;
}

.brand{
    margin:0;
    font-size:34px;
    font-weight:800;
    letter-spacing:5px;
    background:linear-gradient(135deg,#fff,var(--accent-glow));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.tagline{
    margin-top:3px;
    font-size:11px;
    letter-spacing:3px;
    color:var(--text-muted);
    text-transform:uppercase;
}

.sub{
    margin:5px 0;
    font-size:13px;
    color:var(--text-muted);
}

#statusKoneksi{
    font-size:12px;
    color:var(--text-muted);
    margin:8px 0 16px;
    text-align:center;
}

#statusKoneksi.error{
    color:#f87171;
    font-weight:bold;
}

/* NOTIFIKASI */
#notifPelangganBaru{
    max-width:950px;
    margin:0 auto 18px;
    padding:0;
    max-height:0;
    overflow:hidden;
    opacity:0;
    border-radius:12px;
    background:linear-gradient(135deg,#f59e0b,#d97706);
    color:#1c1c1e;
    font-weight:700;
    text-align:center;
    transition:.3s ease;
}

#notifPelangganBaru.show{
    max-height:100px;
    padding:14px 18px;
    opacity:1;
}

/* PANGGILAN */
#panggilanBanner{
    max-width:950px;
    margin:0 auto 25px;
    padding:18px;
    text-align:center;
    border-radius:18px;
    background:linear-gradient(135deg,var(--bg-surface),var(--bg-surface-2));
    border:1px solid rgba(192,132,252,.2);
}

#panggilanBanner.aktif{
    border-color:var(--accent-glow);
    box-shadow:0 0 35px -8px rgba(124,58,237,.7);
    animation:pulseBanner 1.4s infinite;
}

@keyframes pulseBanner{
    0%,100%{box-shadow:0 0 20px -5px rgba(124,58,237,.4);}
    50%{box-shadow:0 0 40px 5px rgba(124,58,237,.65);}
}

.labelPanggilan{
    font-size:11px;
    letter-spacing:3px;
    color:var(--accent-glow);
}

.nomorBesar{
    margin:6px 0;
    font-family:var(--mono);
    font-size:32px;
    font-weight:800;
}

.infoPanggilan{
    color:var(--text-muted);
    font-size:13px;
}

/* GAME */
.gameGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px;
    max-width:950px;
    margin:0 auto 30px;
}

.gameCard{
    position:relative;
    overflow:hidden;
    padding:20px;
    border-radius:18px;
    background:linear-gradient(160deg,var(--bg-surface),#170e2c);
    border:1px solid rgba(255,255,255,.06);
}

.gameCard::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
}

.gameCard.ps5::before{
    background:var(--ps5);
    box-shadow:0 0 14px var(--ps5);
}

.gameCard.ps4::before{
    background:var(--ps4);
    box-shadow:0 0 14px var(--ps4);
}

.gameCard.nintendo::before{
    background:var(--nintendo);
    box-shadow:0 0 14px var(--nintendo);
}

.gameCard.racing::before{
    background:var(--racing);
    box-shadow:0 0 14px var(--racing);
}

.icon{
    display:block;
    margin-bottom:8px;
}

.gameCard h4{
    margin:0 0 4px;
    font-size:19px;
}

.waiting-count{
    margin-bottom:12px;
    color:var(--text-muted);
    font-size:12px;
}

.gameCard button{
    width:100%;
    padding:12px;
    margin-bottom:8px;
    border:0;
    border-radius:10px;
    color:#fff;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
}

.btnPanggil{
    background:linear-gradient(135deg,#f59e0b,#d97706);
}

.btnAmbil.ps5{
    background:linear-gradient(135deg,var(--ps5),#6D28D9);
}

.btnAmbil.ps4{
    background:linear-gradient(135deg,var(--ps4),#4338CA);
}

.btnAmbil.nintendo{
    background:linear-gradient(135deg,var(--nintendo),#A21CAF);
}

.btnAmbil.racing{
    background:linear-gradient(135deg,var(--racing),#0891B2);
}

.gameCard button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* ADMIN / KONTROL LANGSUNG */
#controlSection{
    max-width:950px;
    margin:0 auto;
    padding:20px;
    border-radius:18px;
    background:linear-gradient(160deg,var(--bg-surface),#170e2c);
    border:1px solid rgba(255,255,255,.06);
}

.sectionTitle{
    margin:0 0 15px;
    text-align:center;
    font-size:15px;
    letter-spacing:2px;
    color:var(--text-muted);
}

.adminList{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.adminRow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:12px;
    border-radius:10px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.05);
}

.adminInfo{
    font-size:13px;
    line-height:1.5;
}

.adminInfo strong{
    color:var(--accent-glow);
    font-family:var(--mono);
}

.adminButtons{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

.adminButtons button{
    padding:7px 10px;
    border:0;
    border-radius:7px;
    color:white;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
}

.btnMulai{background:var(--accent);}
.btnWaktu{background:#0d9488;}
.btnSelesai{background:#16a34a;}
.btnHapus{background:#dc2626;}

.empty-msg{
    padding:20px;
    color:var(--text-muted);
    text-align:center;
    font-size:13px;
}

/* RESET */
.resetArea{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,.07);
    text-align:center;
}

#resetAllBtn{
    padding:10px 18px;
    border:0;
    border-radius:10px;
    background:#7f1d1d;
    color:#fff;
    font-weight:700;
    cursor:pointer;
}

.footer{
    margin-top:25px;
    text-align:center;
    color:var(--text-muted);
    font-size:11px;
}

@media(max-width:600px){
    body{
        padding:22px 12px 50px;
    }

    .brand{
        font-size:28px;
    }

    .adminRow{
        align-items:flex-start;
    }

    .adminButtons{
        width:100%;
    }

    .adminButtons button{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="header">

    <div class="logoMark">
        <div class="bar"></div>
    </div>

    <h1 class="brand">PLAYNEST</h1>

    <div class="tagline">Premium Gaming Lounge</div>

    <p class="sub">Panel Kasir — Digital Queue System</p>

    <p id="statusKoneksi">Menghubungkan ke server...</p>

</div>

<div id="notifPelangganBaru"></div>

<div id="panggilanBanner">

    <div class="labelPanggilan">
        STATUS PANGGILAN
    </div>

    <div class="nomorBesar" id="panggilanNomor">
        Belum ada panggilan
    </div>

    <div class="infoPanggilan" id="panggilanCustomer"></div>

</div>

<div class="gameGrid" id="gameGrid"></div>

<div id="controlSection">

    <h3 class="sectionTitle">
        🎮 KONTROL ANTREAN
    </h3>

    <div id="adminList" class="adminList"></div>

    <div class="resetArea">
        <button id="resetAllBtn" onclick="resetSemua()">
            🗑️ Reset Semua Antrean
        </button>
    </div>

</div>

<div class="footer">
    PLAYNEST DIGITAL QUEUE SYSTEM
</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";

const JENIS_GAME = [
    "PS5",
    "PS4",
    "Nintendo",
    "Racing"
];

const DURASI_PER_GAME = {
    PS5:60,
    PS4:60,
    Nintendo:45,
    Racing:30
};

let semuaAntrean = [];
let sedangProses = false;
let bannerQueueId = null;

let idTerakhirDiketahui = new Set();
let pertamaKaliMuat = true;

const ICON_SVG = {

PS5:`
<svg class="icon" viewBox="0 0 64 40" width="48" height="30">
<path d="M10 26 C6 26 4 22 6 16 C8 9 14 6 22 6 L42 6 C50 6 56 9 58 16 C60 22 58 26 54 26 C50 26 49 22 45 22 L19 22 C15 22 14 26 10 26 Z"
fill="none"
stroke="var(--ps5)"
stroke-width="2.2"/>
<circle cx="16" cy="16" r="2.4" fill="var(--ps5)"/>
<circle cx="48" cy="16" r="2.4" fill="none" stroke="var(--ps5)" stroke-width="1.6"/>
<circle cx="24" cy="12" r="1.6" fill="var(--ps5)"/>
<circle cx="24" cy="18" r="1.6" fill="var(--ps5)"/>
<line x1="21" y1="15" x2="27" y2="15" stroke="var(--ps5)" stroke-width="1.6"/>
</svg>`,

PS4:`
<svg class="icon" viewBox="0 0 64 40" width="48" height="30">
<path d="M10 26 C6 26 4 22 6 16 C8 9 14 6 22 6 L42 6 C50 6 56 9 58 16 C60 22 58 26 54 26 C50 26 49 22 45 22 L19 22 C15 22 14 26 10 26 Z"
fill="none"
stroke="var(--ps4)"
stroke-width="2.2"/>
<circle cx="16" cy="16" r="2.4" fill="var(--ps4)"/>
<circle cx="48" cy="16" r="2.4" fill="none" stroke="var(--ps4)" stroke-width="1.6"/>
<circle cx="24" cy="12" r="1.6" fill="var(--ps4)"/>
<circle cx="24" cy="18" r="1.6" fill="var(--ps4)"/>
<line x1="21" y1="15" x2="27" y2="15" stroke="var(--ps4)" stroke-width="1.6"/>
</svg>`,

Nintendo:`
<svg class="icon" viewBox="0 0 64 40" width="48" height="30">
<rect x="8" y="4" width="18" height="32" rx="9" fill="none" stroke="var(--nintendo)" stroke-width="2.2"/>
<rect x="38" y="4" width="18" height="32" rx="9" fill="none" stroke="var(--nintendo)" stroke-width="2.2"/>
<circle cx="17" cy="14" r="2.2" fill="var(--nintendo)"/>
<line x1="14" y1="24" x2="20" y2="24" stroke="var(--nintendo)" stroke-width="1.8"/>
<line x1="17" y1="21" x2="17" y2="27" stroke="var(--nintendo)" stroke-width="1.8"/>
<circle cx="47" cy="14" r="1.8" fill="none" stroke="var(--nintendo)" stroke-width="1.4"/>
<circle cx="47" cy="24" r="1.8" fill="var(--nintendo)"/>
</svg>`,

Racing:`
<svg class="icon" viewBox="0 0 64 40" width="48" height="30">
<circle cx="32" cy="20" r="15" fill="none" stroke="var(--racing)" stroke-width="2.2"/>
<circle cx="32" cy="20" r="4" fill="none" stroke="var(--racing)" stroke-width="1.8"/>
<line x1="32" y1="8" x2="32" y2="16" stroke="var(--racing)" stroke-width="2"/>
<line x1="21" y1="26" x2="28" y2="22" stroke="var(--racing)" stroke-width="2"/>
<line x1="43" y1="26" x2="36" y2="22" stroke="var(--racing)" stroke-width="2"/>
</svg>`

};


/* =========================
   API
========================= */

async function panggilAPI(params){

    params._ts = Date.now();

    const url =
        API_URL +
        "?" +
        new URLSearchParams(params).toString();

    const response =
        await fetch(url,{
            cache:"no-store"
        });

    return await response.json();
}


/* =========================
   BUNYI
========================= */

function beepPelangganBaru(){

    try{

        const ctx =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        const waktu = ctx.currentTime;

        [660,880].forEach((freq,index)=>{

            const osc =
                ctx.createOscillator();

            const gain =
                ctx.createGain();

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.frequency.value = freq;

            gain.gain.setValueAtTime(
                0.25,
                waktu + index * 0.18
            );

            osc.start(
                waktu + index * 0.18
            );

            osc.stop(
                waktu + index * 0.18 + 0.16
            );

        });

    }catch(error){}

}


/* =========================
   NOTIFIKASI CUSTOMER BARU
========================= */

function tampilkanNotifPelangganBaru(data){

    if(!data || data.length === 0) return;

    beepPelangganBaru();

    if(navigator.vibrate){
        navigator.vibrate([150,80,150]);
    }

    const el =
        document.getElementById(
            "notifPelangganBaru"
        );

    el.textContent =
        "🔔 Pelanggan baru: " +
        data.map(item =>
            item.queueId +
            " — " +
            item.customer
        ).join(", ");

    el.classList.add("show");

    clearTimeout(
        window.notifTimeout
    );

    window.notifTimeout =
        setTimeout(()=>{
            el.classList.remove("show");
        },6000);
}


/* =========================
   CEK CUSTOMER BARU
========================= */

function cekPelangganBaru(data){

    const idSekarang =
        new Set(
            data.map(item =>
                item.queueId
            )
        );

    if(pertamaKaliMuat){

        idTerakhirDiketahui =
            idSekarang;

        pertamaKaliMuat = false;

        return;
    }

    const pelangganBaru =
        data.filter(item =>
            item.status === "WAITING" &&
            !idTerakhirDiketahui.has(
                item.queueId
            )
        );

    if(pelangganBaru.length > 0){

        tampilkanNotifPelangganBaru(
            pelangganBaru
        );

    }

    idTerakhirDiketahui =
        idSekarang;
}


/* =========================
   LOAD DATA
========================= */

async function muatData(){

    try{

        const hasil =
            await panggilAPI({
                action:"list"
            });

        if(!hasil.success){

            tampilkanErrorKoneksi(
                hasil.message
            );

            return;
        }

        cekPelangganBaru(
            hasil.data
        );

        semuaAntrean =
            hasil.data;

        const status =
            document.getElementById(
                "statusKoneksi"
            );

        status.textContent =
            "🟢 Terhubung — data tersinkron";

        status.classList.remove(
            "error"
        );

        render();

    }catch(error){

        tampilkanErrorKoneksi(
            error.toString()
        );

    }

}


/* =========================
   ERROR
========================= */

function tampilkanErrorKoneksi(pesan){

    const el =
        document.getElementById(
            "statusKoneksi"
        );

    el.textContent =
        "🔴 Gagal terhubung ke server. " +
        pesan;

    el.classList.add("error");

}


/* =========================
   AMBIL ANTREAN
========================= */

async function ambilAntrean(game){

    if(sedangProses) return;

    let namaCustomer =
        prompt(
            "Nama customer:",
            ""
        );

    if(namaCustomer === null)
        return;

    namaCustomer =
        namaCustomer.trim();

    if(namaCustomer === "")
        namaCustomer =
            "Tanpa Nama";


    let jumlahPlayer =
        prompt(
            "Jumlah pemain:",
            "1"
        );

    if(jumlahPlayer === null)
        return;

    jumlahPlayer =
        parseInt(jumlahPlayer);

    if(!jumlahPlayer ||
       jumlahPlayer < 1){

        jumlahPlayer = 1;

    }


    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"add",
                game:game,
                customer:namaCustomer,
                players:jumlahPlayer
            });

        if(!hasil.success){

            alert(
                "Gagal menambah antrean:\n" +
                hasil.message
            );

            return;
        }

        alert(
            "✅ Antrean berhasil ditambahkan!\n\n" +
            "Nomor: " +
            hasil.queueId +
            "\nGame: " +
            game +
            "\nCustomer: " +
            namaCustomer
        );

        await muatData();

    }catch(error){

        alert(
            "Terjadi kesalahan:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   PANGGIL ANTREAN
========================= */

async function panggilAntrian(game){

    if(sedangProses) return;

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"call",
                game:game
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Tidak ada antrean untuk " +
                game
            );

            return;
        }

        tampilkanBanner(
            hasil,
            game
        );

        await muatData();

    }catch(error){

        alert(
            "Gagal memanggil antrean:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   BANNER PANGGILAN
========================= */

function tampilkanBanner(item,game){

    const banner =
        document.getElementById(
            "panggilanBanner"
        );

    banner.classList.add("aktif");

    document.getElementById(
        "panggilanNomor"
    ).textContent =
        item.queueId;

    document.getElementById(
        "panggilanCustomer"
    ).textContent =
        item.customer +
        " — " +
        item.players +
        " pemain (" +
        game +
        ") — menunggu kedatangan";

    bannerQueueId =
        item.queueId;

}


/* =========================
   MULAI SESI
========================= */

async function mulaiSesi(queueId,game){

    if(sedangProses) return;

    const defaultDurasi =
        DURASI_PER_GAME[game] || 60;

    let durasi =
        prompt(
            "Durasi sesi " +
            queueId +
            " (menit):",
            String(defaultDurasi)
        );

    if(durasi === null)
        return;

    durasi =
        parseInt(durasi);

    if(!durasi || durasi < 1)
        durasi = defaultDurasi;

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"mulai",
                queueId:queueId,
                durasi:durasi
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Gagal memulai sesi."
            );

            return;
        }

        await muatData();

    }catch(error){

        alert(
            "Gagal memulai sesi:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   UBAH WAKTU
========================= */

async function ubahWaktu(queueId,delta){

    if(sedangProses) return;

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"ubahDurasi",
                queueId:queueId,
                delta:delta
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Gagal mengubah waktu."
            );

            return;
        }

        await muatData();

    }catch(error){

        alert(
            "Gagal mengubah waktu:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   SELESAI
========================= */

async function tandaiSelesai(queueId){

    if(sedangProses) return;

    if(!confirm(
        "Selesaikan antrean " +
        queueId +
        "?"
    )) return;

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"done",
                queueId:queueId
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Gagal menyelesaikan antrean."
            );

            return;
        }

        if(queueId === bannerQueueId){
            resetBanner();
        }

        await muatData();

    }catch(error){

        alert(
            "Gagal menyelesaikan:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   HAPUS
========================= */

async function hapusAntrean(queueId){

    if(sedangProses) return;

    if(!confirm(
        "Hapus antrean " +
        queueId +
        "?\n\n" +
        "Antrean akan masuk ke riwayat sebagai DIBATALKAN."
    )) return;

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"delete",
                queueId:queueId
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Gagal menghapus antrean."
            );

            return;
        }

        if(queueId === bannerQueueId){
            resetBanner();
        }

        await muatData();

    }catch(error){

        alert(
            "Gagal menghapus:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   RESET SEMUA
========================= */

async function resetSemua(){

    if(sedangProses) return;

    const konfirmasi1 =
        confirm(
            "⚠️ PERINGATAN\n\n" +
            "Semua antrean aktif akan dihapus.\n" +
            "Lanjutkan?"
        );

    if(!konfirmasi1)
        return;

    const konfirmasi2 =
        prompt(
            "Ketik RESET untuk melanjutkan:"
        );

    if(konfirmasi2 !== "RESET"){

        alert(
            "Reset dibatalkan."
        );

        return;
    }

    sedangProses = true;

    try{

        const hasil =
            await panggilAPI({
                action:"resetAll"
            });

        if(!hasil.success){

            alert(
                hasil.message ||
                "Gagal melakukan reset."
            );

            return;
        }

        resetBanner();

        alert(
            "✅ Semua antrean berhasil direset."
        );

        idTerakhirDiketahui =
            new Set();

        pertamaKaliMuat = true;

        await muatData();

    }catch(error){

        alert(
            "Gagal reset:\n" +
            error
        );

    }finally{

        sedangProses = false;

    }

}


/* =========================
   RESET BANNER
========================= */

function resetBanner(){

    const banner =
        document.getElementById(
            "panggilanBanner"
        );

    banner.classList.remove(
        "aktif"
    );

    document.getElementById(
        "panggilanNomor"
    ).textContent =
        "Belum ada panggilan";

    document.getElementById(
        "panggilanCustomer"
    ).textContent =
        "";

    bannerQueueId = null;

}


/* =========================
   RENDER
========================= */

function render(){

    renderGameCards();
    renderKontrol();

}


/* =========================
   GAME CARDS
========================= */

function renderGameCards(){

    const grid =
        document.getElementById(
            "gameGrid"
        );

    grid.innerHTML = "";

    JENIS_GAME.forEach(game=>{

        const daftarGame =
            semuaAntrean.filter(
                item =>
                    item.game === game
            );

        const menunggu =
            daftarGame.filter(
                item =>
                    item.status === "WAITING"
            );

        const kelas =
            game.toLowerCase();

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "gameCard " + kelas;

        card.innerHTML = `

            ${ICON_SVG[game]}

            <h4>${game}</h4>

            <div class="waiting-count">
                ${menunggu.length} antrean menunggu
            </div>

            <button
                class="btnAmbil ${kelas}"
                onclick="ambilAntrean('${game}')"
            >
                🎫 Tambah Antrean
            </button>

            <button
                class="btnPanggil"
                onclick="panggilAntrian('${game}')"
                ${menunggu.length === 0 ? "disabled" : ""}
            >
                🔔 Panggil Berikutnya
            </button>

        `;

        grid.appendChild(card);

    });

}


/* =========================
   KONTROL SEMUA ANTREAN
========================= */

function renderKontrol(){

    const container =
        document.getElementById(
            "adminList"
        );

    if(semuaAntrean.length === 0){

        container.innerHTML =
            '<div class="empty-msg">Tidak ada antrean aktif.</div>';

        return;
    }

    container.innerHTML =
        semuaAntrean.map(item=>{

            let kontrolWaktu = "";

            if(
                item.status === "PLAYING" &&
                !item.mulaiMain
            ){

                kontrolWaktu = `
                    <button
                        class="btnMulai"
                        onclick="mulaiSesi(
                            '${item.queueId}',
                            '${item.game}'
                        )"
                    >
                        ▶️ Mulai
                    </button>
                `;

            }else if(
                item.status === "PLAYING" &&
                item.mulaiMain
            ){

                kontrolWaktu = `
                    <button
                        class="btnWaktu"
                        onclick="ubahWaktu(
                            '${item.queueId}',
                            10
                        )"
                    >
                        +10m
                    </button>

                    <button
                        class="btnWaktu"
                        onclick="ubahWaktu(
                            '${item.queueId}',
                            -10
                        )"
                    >
                        -10m
                    </button>
                `;

            }

            let statusText =
                item.status;

            if(
                item.status === "PLAYING" &&
                !item.mulaiMain
            ){

                statusText =
                    "DIPANGGIL — belum mulai";

            }

            return `

                <div class="adminRow">

                    <div class="adminInfo">

                        <strong>
                            ${item.queueId}
                        </strong>

                        —
                        ${item.customer}

                        —
                        ${item.players} pemain

                        —
                        ${item.game}

                        <br>

                        Status:
                        <b>${statusText}</b>

                    </div>

                    <div class="adminButtons">

                        ${kontrolWaktu}

                        <button
                            class="btnSelesai"
                            onclick="tandaiSelesai(
                                '${item.queueId}'
                            )"
                        >
                            ✓ Selesai
                        </button>

                        <button
                            class="btnHapus"
                            onclick="hapusAntrean(
                                '${item.queueId}'
                            )"
                        >
                            🗑️ Hapus
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================
   START
========================= */

muatData();

setInterval(
    muatData,
    3000
);

</script>
