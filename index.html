<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<meta
    name="theme-color"
    content="#090314"
>

<title>PLAYNEST CONTROL — CAPTAIN</title>

<style>

:root {

    --bg: #090314;
    --surface: #120720;
    --surface2: #190b2d;

    --purple: #8b5cf6;
    --purple2: #c084fc;

    --green: #4ade80;
    --yellow: #facc15;
    --red: #f87171;
    --blue: #60a5fa;

    --text: #f5efff;
    --muted: #a99bd1;

    --border: rgba(192,132,252,.14);

}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at top,
            #24103f 0%,
            #090314 55%,
            #050208 100%
        );

    color: var(--text);

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    padding:
        24px 12px 60px;

}


/* =====================================================
   LOGIN
===================================================== */

#loginScreen {

    position: fixed;

    inset: 0;

    z-index: 99999;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at top,
            #24103f,
            #090314 65%,
            #050208
        );

}

.login-box {

    width: 100%;

    max-width: 380px;

    padding: 32px 24px;

    text-align: center;

    background:
        linear-gradient(
            145deg,
            rgba(25,11,45,.96),
            rgba(9,3,20,.98)
        );

    border:
        1px solid var(--border);

    border-radius: 24px;

    box-shadow:
        0 20px 70px rgba(0,0,0,.55),
        0 0 40px rgba(139,92,246,.08);

}

.login-logo {

    color: var(--purple2);

    font-size: 13px;

    letter-spacing: 8px;

    margin-bottom: 14px;

}

.login-title {

    font-size: 28px;

    font-weight: 900;

    letter-spacing: 3px;

}

.login-subtitle {

    margin-top: 8px;

    color: var(--muted);

    font-size: 12px;

    letter-spacing: 2px;

}

.lock-icon {

    width: 74px;

    height: 74px;

    margin: 28px auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(139,92,246,.30),
            rgba(139,92,246,.05)
        );

    border:
        1px solid rgba(192,132,252,.20);

    font-size: 34px;

    box-shadow:
        0 0 30px rgba(139,92,246,.20);

}

.pin-label {

    color: var(--muted);

    font-size: 12px;

    letter-spacing: 1.5px;

    margin-bottom: 10px;

}

.pin-input {

    width: 100%;

    padding: 15px;

    text-align: center;

    font-size: 24px;

    letter-spacing: 12px;

    color: white;

    background: #08020f;

    border:
        1px solid rgba(192,132,252,.18);

    border-radius: 12px;

    outline: none;

}

.pin-input:focus {

    border-color: var(--purple);

    box-shadow:
        0 0 20px rgba(139,92,246,.15);

}

.login-button {

    width: 100%;

    margin-top: 16px;

    padding: 14px;

    border: none;

    border-radius: 12px;

    color: white;

    font-weight: 800;

    font-size: 14px;

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6d28d9
        );

    cursor: pointer;

}

.login-button:active {
    transform: scale(.98);
}

.login-error {

    min-height: 20px;

    margin-top: 12px;

    color: var(--red);

    font-size: 12px;

}


/* =====================================================
   MAIN
===================================================== */

#app {

    display: none;

}

.container {

    width: 100%;

    max-width: 1100px;

    margin: auto;

}


/* =====================================================
   HEADER
===================================================== */

header {

    text-align: center;

    margin-bottom: 28px;

}

.logo {

    font-size: 13px;

    letter-spacing: 8px;

    color: var(--purple2);

    margin-bottom: 10px;

}

h1 {

    margin: 0;

    font-size: 32px;

    letter-spacing: 5px;

    font-weight: 900;

}

.subtitle {

    color: var(--muted);

    letter-spacing: 3px;

    font-size: 12px;

    margin-top: 8px;

}

#connection {

    margin-top: 16px;

    color: var(--muted);

    font-size: 12px;

}

#connection.error {

    color: var(--red);

}


/* =====================================================
   TOP ACTIONS
===================================================== */

.top-actions {

    display: flex;

    justify-content: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 25px;

}

.action-button {

    border: 1px solid rgba(192,132,252,.12);

    background:
        rgba(18,7,32,.80);

    color: var(--text);

    padding: 10px 13px;

    border-radius: 10px;

    font-size: 12px;

    font-weight: 700;

    cursor: pointer;

}

.action-button:active {
    transform: scale(.97);
}

.action-button.primary {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6d28d9
        );

}

.action-button.logout {

    color: var(--red);

}


/* =====================================================
   STATISTICS
===================================================== */

.stats {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 12px;

    margin-bottom: 30px;

}

.stat {

    background:
        rgba(18,7,32,.85);

    border:
        1px solid rgba(192,132,252,.12);

    border-radius: 18px;

    padding: 18px 10px;

    text-align: center;

}

.stat-number {

    font-size: 32px;

    font-weight: 800;

    color: var(--purple2);

}

.stat-label {

    margin-top: 5px;

    color: var(--muted);

    font-size: 10px;

    letter-spacing: 1.5px;

}


/* =====================================================
   SECTION
===================================================== */

.section-title {

    text-align: center;

    color: var(--purple2);

    font-size: 14px;

    letter-spacing: 3px;

    margin:
        35px 0 18px;

}


/* =====================================================
   GAME SUMMARY
===================================================== */

.game-summary {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 10px;

}

.game-box {

    background:
        rgba(18,7,32,.70);

    border:
        1px solid rgba(255,255,255,.06);

    border-radius: 14px;

    padding: 16px 8px;

    text-align: center;

}

.game-name {

    font-weight: bold;

    margin-bottom: 7px;

}

.game-count {

    color: var(--muted);

    font-size: 12px;

    line-height: 20px;

}


/* =====================================================
   QUEUE
===================================================== */

.queue-list {

    display: grid;

    gap: 14px;

}

.queue-card {

    background:
        linear-gradient(
            145deg,
            var(--surface2),
            var(--surface)
        );

    border:
        1px solid rgba(255,255,255,.06);

    border-left:
        4px solid var(--yellow);

    border-radius: 18px;

    padding: 20px;

    overflow: hidden;

}

.queue-card.playing {

    border-left-color:
        var(--green);

    box-shadow:
        0 0 25px
        rgba(74,222,128,.08);

}

.queue-card.called {

    border-left-color:
        var(--blue);

}

.queue-top {

    display: flex;

    justify-content:
        space-between;

    gap: 15px;

    align-items:
        flex-start;

}

.queue-id {

    font-family:
        Consolas,
        monospace;

    font-size: 25px;

    font-weight: bold;

    color: var(--purple2);

}

.customer {

    margin-top: 6px;

    font-size: 15px;

}

.game {

    margin-top: 6px;

    color: var(--muted);

    font-size: 13px;

}

.status {

    display: inline-block;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: .5px;

    white-space: nowrap;

}

.status.waiting {

    background:
        rgba(250,204,21,.12);

    color:
        var(--yellow);

}

.status.playing {

    background:
        rgba(74,222,128,.12);

    color:
        var(--green);

}

.status.called {

    background:
        rgba(96,165,250,.12);

    color:
        var(--blue);

}


/* =====================================================
   TIMER
===================================================== */

.timer {

    text-align: center;

    font-family:
        Consolas,
        monospace;

    font-size: 40px;

    font-weight: bold;

    margin: 18px 0;

    color:
        var(--green);

}

.timer.warning {

    color:
        var(--yellow);

    animation:
        pulse 1.5s infinite;

}

.timer.expired {

    color:
        var(--red);

    animation:
        pulse .8s infinite;

}

@keyframes pulse {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .55;
    }

}

.info {

    color:
        var(--muted);

    font-size: 13px;

    margin-top: 12px;

    line-height: 20px;

}


/* =====================================================
   BUTTONS
===================================================== */

.buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 18px;

}

button {

    border: none;

    border-radius: 10px;

    padding: 12px 14px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    font-size: 12px;

}

button:disabled {

    opacity: .45;

    cursor: not-allowed;

}

.btn-call {

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

}

.btn-start {

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #15803d
        );

}

.btn-add {

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #6d28d9
        );

}

.btn-minus {

    background:
        linear-gradient(
            135deg,
            #4b5563,
            #374151
        );

}

.btn-done {

    background:
        linear-gradient(
            135deg,
            #16a34a,
            #166534
        );

}

.btn-delete {

    background:
        linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );

}


/* =====================================================
   EMPTY
===================================================== */

.empty {

    text-align: center;

    color:
        var(--muted);

    padding:
        35px 10px;

}


/* =====================================================
   NOTIFICATION TOAST
===================================================== */

#toastContainer {

    position: fixed;

    top: 16px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 9999;

    width:
        min(92%, 430px);

    display:
        flex;

    flex-direction:
        column;

    gap: 8px;

    pointer-events:
        none;

}

.toast {

    pointer-events:
        auto;

    background:
        linear-gradient(
            145deg,
            #1d0b32,
            #0d0418
        );

    border:
        1px solid
        rgba(192,132,252,.20);

    border-left:
        4px solid
        var(--purple2);

    border-radius:
        14px;

    padding:
        13px 15px;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.45);

    animation:
        toastIn .25s ease;

}

.toast.warning {

    border-left-color:
        var(--yellow);

}

.toast.danger {

    border-left-color:
        var(--red);

}

.toast.success {

    border-left-color:
        var(--green);

}

.toast-title {

    font-weight:
        800;

    font-size:
        13px;

}

.toast-text {

    margin-top:
        4px;

    color:
        var(--muted);

    font-size:
        12px;

    line-height:
        18px;

}

@keyframes toastIn {

    from {

        opacity: 0;

        transform:
            translateY(-15px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   NOTIFICATION PANEL
===================================================== */

.notification-box {

    margin-top:
        18px;

    background:
        rgba(18,7,32,.65);

    border:
        1px solid
        rgba(192,132,252,.10);

    border-radius:
        14px;

    padding:
        13px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        11px;

}

.notification-box strong {

    color:
        var(--purple2);

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    body {

        padding:
            18px 12px 50px;

    }

    h1 {

        font-size:
            25px;

        letter-spacing:
            4px;

    }

    .subtitle {

        font-size:
            10px;

        letter-spacing:
            2px;

    }

    .stats {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .game-summary {

        grid-template-columns:
            repeat(2, 1fr);

    }

    .queue-top {

        flex-direction:
            column;

    }

    .queue-id {

        font-size:
            23px;

    }

    .timer {

        font-size:
            34px;

    }

    .buttons {

        display:
            grid;

        grid-template-columns:
            repeat(2, 1fr);

    }

    .buttons button {

        width:
            100%;

        min-height:
            45px;

    }

    .btn-call {

        grid-column:
            span 2;

    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:380px) {

    body {

        padding-left:
            8px;

        padding-right:
            8px;

    }

    .stats {

        gap:
            8px;

    }

    .stat {

        padding:
            15px 5px;

    }

    .stat-number {

        font-size:
            28px;

    }

    .game-summary {

        gap:
            8px;

    }

    .queue-card {

        padding:
            16px;

    }

}

</style>

</head>


<body>

<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";


/*
   PIN CAPTAIN

   Untuk versi ini:
   1234
*/

const CAPTAIN_PIN = "1234";


/*
   Daftar game PLAYNEST
*/

const GAMES = [

    "PS5",
    "PS4",
    "Nintendo",
    "Racing"

];


/*
   Interval sinkronisasi.

   5 detik lebih ringan untuk HP
   dibanding request setiap 1 detik.
*/

const REFRESH_INTERVAL = 5000;


/*
   Peringatan waktu.

   10 menit sebelum habis.
*/

const WARNING_SECONDS = 600;


/* =====================================================
   STATE
===================================================== */

let semuaAntrean = [];

let sedangProses = false;

let sudahLogin = false;


/*
   Menyimpan ID notifikasi
   agar tidak muncul berulang-ulang.
*/

let notifikasiSudahMuncul =
    new Set();


/*
   Menyimpan status antrean
   sebelumnya untuk mendeteksi perubahan.
*/

let snapshotLama =
    new Map();


/*
   Menyimpan status peringatan timer.
*/

let warningSudahMuncul =
    new Set();

let expiredSudahMuncul =
    new Set();


/* =====================================================
   ELEMENT
===================================================== */

const loginScreen =
    document.getElementById(
        "loginScreen"
    );

const app =
    document.getElementById(
        "app"
    );

const pinInput =
    document.getElementById(
        "pinInput"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const loginError =
    document.getElementById(
        "loginError"
    );


/* =====================================================
   LOGIN
===================================================== */

function loginCaptain() {

    const pin =
        pinInput.value.trim();


    if (pin === CAPTAIN_PIN) {

        sudahLogin = true;

        sessionStorage.setItem(
            "playnestCaptainLogin",
            "true"
        );

        loginError.textContent =
            "";

        loginScreen.style.display =
            "none";

        app.style.display =
            "block";

        muatData();

        tampilkanToast(
            "LOGIN BERHASIL",
            "Selamat datang, Captain.",
            "success"
        );

        return;
    }


    loginError.textContent =
        "❌ PIN Captain salah.";

    pinInput.value =
        "";

    pinInput.focus();

}


loginButton.addEventListener(
    "click",
    loginCaptain
);


pinInput.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            loginCaptain();

        }

    }
);


/*
   Cek session login.
*/

if (
    sessionStorage.getItem(
        "playnestCaptainLogin"
    ) === "true"
) {

    sudahLogin = true;

    loginScreen.style.display =
        "none";

    app.style.display =
        "block";

}


/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        function() {

            if (
                !confirm(
                    "Keluar dari dashboard Captain?"
                )
            ) return;

            sessionStorage.removeItem(
                "playnestCaptainLogin"
            );

            sudahLogin = false;

            app.style.display =
                "none";

            loginScreen.style.display =
                "flex";

            pinInput.value =
                "";

            pinInput.focus();

        }
    );


/* =====================================================
   API
===================================================== */

async function panggilAPI(params) {

    params._ts =
        Date.now();


    const url =
        API_URL +
        "?" +
        new URLSearchParams(
            params
        ).toString();


    const response =
        await fetch(
            url,
            {
                method: "GET",
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "HTTP " +
            response.status
        );

    }


    const data =
        await response.json();


    return data;

}


/* =====================================================
   LOAD DATA
===================================================== */

async function muatData() {

    if (!sudahLogin) return;

    try {

        const hasil =
            await panggilAPI({
                action: "list"
            });


        if (
            !hasil ||
            !hasil.success
        ) {

            tampilkanError(
                hasil?.message ||
                "Server mengembalikan error."
            );

            return;

        }


        const dataBaru =
            Array.isArray(
                hasil.data
            )
            ? hasil.data
            : [];


        /*
           Cek perubahan sebelum
           mengganti data.
        */

        deteksiPerubahan(
            dataBaru
        );


        semuaAntrean =
            dataBaru;


        const connection =
            document.getElementById(
                "connection"
            );


        connection.textContent =
            "Terhubung — data tersinkron • " +
            new Date()
                .toLocaleTimeString(
                    "id-ID"
                );

            "error"
        );


        render();


    } catch(error) {

        /*
           Jangan menghapus data lama

        */

        tampilkanError(
            error.message
        );

    }

}

/* =====================================================
   BROWSER NOTIFICATION
===================================================== */

function updateNotificationStatus() {

    const status =
        document.getElementById(
            "notificationStatus"
        );

    const button =
        document.getElementById(
            "notificationButton"
        );


    if (
        !("Notification" in window)
    ) {

        status.textContent =
            "tidak didukung browser";

        button.textContent =
            "🔔 NOTIFIKASI TIDAK DIDUKUNG";

        button.disabled =
            true;

        return;

    }


    if (
        Notification.permission ===
        "granted"
    ) {

        status.textContent =
            "aktif";

        button.textContent =
            "🔔 NOTIFIKASI AKTIF";

        return;

    }


    if (
        Notification.permission ===
        "denied"
    ) {

        status.textContent =
            "diblokir browser";

        button.textContent =
            "🔔 NOTIFIKASI DIBLOKIR";

        return;

    }


    status.textContent =
        "belum diaktifkan";

    button.textContent =
        "🔔 AKTIFKAN NOTIFIKASI";

}


async function aktifkanNotifikasi() {

    if (
        !("Notification" in window)
    ) {

        tampilkanToast(
            "NOTIFIKASI TIDAK DIDUKUNG",
            "Browser HP ini tidak menyediakan Notification API.",
            "warning"
        );

        return;

    }


    try {

        const permission =
            await Notification.requestPermission();


        updateNotificationStatus();


        if (
            permission ===
            "granted"
        ) {

            tampilkanToast(
                "NOTIFIKASI AKTIF",
                "Captain akan menerima peringatan penting.",
                "success"
            );

            kirimNotifikasi(
                "PLAYNEST CONTROL",
                "Notifikasi Captain berhasil diaktifkan."
            );

        }

    } catch(error) {

        console.error(error);

    }

}


function kirimNotifikasi(
    title,
    body
) {

    if (
        !("Notification" in window)
    ) return;


    if (
        Notification.permission !==
        "granted"
    ) return;


    try {

        new Notification(
            title,
            {
                body: body,
                icon: "",
                tag:
                    "playnest-" +
                    Date.now()
            }
        );

    } catch(error) {

        console.error(
            "Notification error:",
            error
        );

    }

}


document
    .getElementById(
        "notificationButton"
    )
    .addEventListener(
        "click",
        aktifkanNotifikasi
    );


updateNotificationStatus();


/* =====================================================
   DETEKSI PERUBAHAN
===================================================== */

function deteksiPerubahan(
    dataBaru
) {

    const snapshotBaru =
        new Map();


    dataBaru.forEach(
        function(item) {

            if (!item.queueId)
                return;


            const id =
                String(
                    item.queueId
                );


            const status =
                String(
                    item.status ||
                    ""
                );


            snapshotBaru.set(
                id,
                status
            );


            /*
               Antrean baru masuk.
            */

            if (
                !snapshotLama.has(id) &&
                status === "WAITING"
            ) {

                const key =
                    "new-" +
                    id;


                if (
                    !notifikasiSudahMuncul.has(
                        key
                    )
                ) {

                    notifikasiSudahMuncul.add(
                        key
                    );


                    const nama =
                        item.customer ||
                        "Customer";


                    const game =
                        item.game ||
                        "";


                    tampilkanToast(
                        "🎫 ANTREAN BARU",
                        id +
                        " — " +
                        nama +
                        " • " +
                        game,
                        "warning"
                    );


                    kirimNotifikasi(
                        "🎫 Antrean Baru",
                        id +
                        " — " +
                        nama +
                        " • " +
                        game
                    );

                }

            }


            /*
               Antrean dipanggil.
            */

            if (
                snapshotLama.has(id) &&
                snapshotLama.get(id) !== status &&
                status === "PLAYING" &&
                !item.mulaiMain
            ) {

                const key =
                    "called-" +
                    id;


                if (
                    !notifikasiSudahMuncul.has(
                        key
                    )
                ) {

                    notifikasiSudahMuncul.add(
                        key
                    );


                    tampilkanToast(
                        "📣 ANTREAN DIPANGGIL",
                        id +
                        " — " +
                        (
                            item.customer ||
                            "Customer"
                        ),
                        "success"
                    );


                    kirimNotifikasi(
                        "📣 Antrean Dipanggil",
                        id +
                        " — Silakan mulai sesi."
                    );

                }

            }

        }
    );


    snapshotLama =
        snapshotBaru;

}

        prompt(

        angka < 1 ||
        angka > 1440
    ) {

        alert(
            "Durasi tidak valid.\nMasukkan 1–1440 menit."

    sedangProses =

    try {

        const hasil =
            await panggilAPI({

                action:
                    "mulai",

                queueId:

                durasi:
                    angka

            });


        if (
            !hasil.success

        } else {

            tampilkanToast(

/* =====================================================
   TIMER
===================================================== */

function hitungSisa(
    item
) {

    if (
        !item.mulaiMain ||
        !item.durasiMenit
    ) {

        return null;

    }


    const mulai =
        Number(
            item.mulaiMain
        );


    const durasi =
        Number(
            item.durasiMenit
        );


    if (
        !Number.isFinite(mulai) ||
        !Number.isFinite(durasi)
    ) {

        return null;

    }


    const total =
        durasi * 60;


    const berlalu =
        Math.floor(
            (
                Date.now() -
                mulai
            ) / 1000
        );


    return total - berlalu;

}


/* =====================================================
   FORMAT TIMER
===================================================== */

function formatTimer(
    seconds
) {

    seconds =
        Math.max(
            0,
            Math.floor(seconds)
        );


    const menit =
        Math.floor(
            seconds / 60
        );


    const detik =
        seconds % 60;


    return (

        String(
            menit
        ).padStart(2, "0")

        +

        ":" +

        String(
            detik
        ).padStart(2, "0")

    );

}


/* =====================================================
   TIMER NOTIFICATION
===================================================== */

function cekPeringatanWaktu() {

    semuaAntrean.forEach(
        function(item) {

            if (
                item.status !==
                "PLAYING"
            ) return;


            if (
                !item.mulaiMain ||
                !item.durasiMenit
            ) return;


            const sisa =
                hitungSisa(
                    item
                );


            if (
                sisa === null
            ) return;


            const id =
                String(
                    item.queueId
                );


            /*
               Hampir habis.
            */

            if (
                sisa > 0 &&
                sisa <= WARNING_SECONDS
            ) {

                if (
                    !warningSudahMuncul.has(
                        id
                    )
                ) {

                    warningSudahMuncul.add(
                        id
                    );


                    const waktu =
                        formatTimer(
                            sisa
                        );


                    tampilkanToast(
                        "⚠️ WAKTU HAMPIR HABIS",
                        id +
                        " tersisa " +
                        waktu,
                        "warning"
                    );


                    kirimNotifikasi(
                        "⚠️ Waktu Hampir Habis",
                        id +
                        " tersisa " +
                        waktu
                    );

                }

            }


            /*
               Waktu habis.
            */

            if (
                sisa <= 0
            ) {

                if (
                    !expiredSudahMuncul.has(
                        id
                    )
                ) {

                    expiredSudahMuncul.add(
                        id
                    );


                    tampilkanToast(
                        "🚨 WAKTU HABIS",
                        id +
                        " sudah mencapai batas waktu.",
                        "danger"
                    );


                    kirimNotifikasi(
                        "🚨 Waktu Habis",
                        id +
                        " sudah mencapai batas waktu."
                    );

                }

            }

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   RENDER
===================================================== */

function render() {

    renderStats();

    renderGameSummary();

    renderQueue();

    cekPeringatanWaktu();

}


/* =====================================================
   STATS
===================================================== */

function renderStats() {

    const playing =
        semuaAntrean.filter(
            function(x) {

                return (
                    x.status ===
                    "PLAYING"
                );

            }
        );


    const waiting =
        semuaAntrean.filter(
            function(x) {

                return (
                    x.status ===
                    "WAITING"
                );

            }
        );


    let hampirHabis =
        0;


    let habis =
        0;


    playing.forEach(
        function(item) {

            const sisa =
                hitungSisa(
                    item
                );


            if (
                sisa !== null
            ) {

                if (
                    sisa <= 0
                ) {

                    habis++;

                }

                else if (
                    sisa <=
                    WARNING_SECONDS
                ) {

                    hampirHabis++;

                }

            }

        }
    );


    document.getElementById(
        "jumlahPlaying"
    ).textContent =
        playing.length;


    document.getElementById(
        "jumlahWaiting"
    ).textContent =
        waiting.length;


    document.getElementById(
        "jumlahHampirHabis"
    ).textContent =
        hampirHabis;


    document.getElementById(
        "jumlahHabis"
    ).textContent =
        habis;

}

/* =====================================================
   QUEUE
===================================================== */

function renderQueue() {

    const container =
        document.getElementById(
            "queueList"
        );


    if (
        semuaAntrean.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                Belum ada antrean aktif.

            </div>

        `;

        return;

    }


    /*
       Urutan:

       1. PLAYING
       2. WAITING
    */

    const data =
        [...semuaAntrean]
        .sort(
            function(a, b) {

                if (
                    a.status ===
                    "PLAYING" &&
                    b.status !==
                    "PLAYING"
                ) {

                    return -1;

                }


                if (
                    a.status !==
                    "PLAYING" &&
                    b.status ===
                    "PLAYING"
                ) {

                    return 1;

                }


                return 0;

            }
        );


    let html =
        "";


    data.forEach(
        function(item) {

            const isPlaying =
                item.status ===
                "PLAYING";


            const sisa =
                hitungSisa(
                    item
                );


            let cardClass =
                "queue-card";


            if (
                isPlaying &&
                item.mulaiMain
            ) {

                cardClass +=
                    " playing";

            }

            else if (
                isPlaying
            ) {

                cardClass +=
                    " called";

            }


            let statusClass =
                "waiting";


            let statusText =
                "🟡 WAITING";


            if (
                isPlaying &&
                item.mulaiMain
            ) {

                statusClass =
                    "playing";

                statusText =
                    "🟢 PLAYING";

            }

            else if (
                isPlaying
            ) {

                statusClass =
                    "called";

                statusText =
                    "🔵 DIPANGGIL";

            }


            html += `

                <div
                    class="${cardClass}"
                >

                    <div
                        class="queue-top"
                    >

                        <div>

                            <div
                                class="queue-id"
                            >

                                ${escapeHTML(
                                    item.queueId
                                )}

                            </div>


                            <div
                                class="customer"
                            >

                                👤
                                ${escapeHTML(
                                    item.customer
                                )}

                                —
                                ${escapeHTML(
                                    item.players
                                )}
                                pemain

                            </div>


                            <div
                                class="game"
                            >

                                🎮
                                ${escapeHTML(
                                    item.game
                                )}

                            </div>

                        </div>


                        <div>

                            <span
                                class="
                                    status
                                    ${statusClass}
                                "
                            >

                                ${statusText}

                            </span>

                        </div>

                    </div>

            `;


            /*
               TIMER
            */

            if (
                isPlaying &&
                item.mulaiMain &&
                item.durasiMenit
            ) {

                let timerClass =
                    "timer";


                if (
                    sisa <=
                    WARNING_SECONDS &&
                    sisa > 0
                ) {

                    timerClass +=
                        " warning";

                }


                if (
                    sisa <= 0
                ) {

                    timerClass +=
                        " expired";

                }


                html += `

                    <div
                        class="${timerClass}"
                    >

                        ${
                            sisa <= 0
                            ? "WAKTU HABIS"
                            : formatTimer(
                                sisa
                            )
                        }

                    </div>


                    <div
                        class="info"
                        style="
                            text-align:center;
                        "
                    >

                        Durasi:
                        ${escapeHTML(
                            item.durasiMenit
                        )}
                        menit

                    </div>

                `;

            }


            /*
               DIPANGGIL TAPI BELUM DIMULAI
            */

            else if (
                isPlaying
            ) {

                html += `

                    <div
                        class="info"
                        style="
                            text-align:center;
                        "
                    >

                        📣 Antrean sudah
                        dipanggil.

                        <br>

                        Silakan tekan
                        <b>
                            MULAI SESI
                        </b>
                        untuk menjalankan timer.

                    </div>

                `;

            }


            /*
               BUTTONS
            */

            html += `

                <div
                    class="buttons"
                >

            `;


            /*
               WAITING
            */

            if (
                item.status ===
                "WAITING"
            ) {

                html += `

                    <button
                        class="btn-call"
                        onclick="
                            panggilAntrean(
                                '${escapeHTML(
                                    item.game
                                )}'
                            )
                        "
                    >

                        📣 PANGGIL
                        ${escapeHTML(
                            item.game
                        )}

                    </button>


                    <button
                        class="btn-delete"
                        onclick="
                            hapus(
                                '${escapeHTML(
                                    item.queueId
                                )}'
                            )
                        "
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }


            /*
               CALLED
            */

            if (
                item.status ===
                "PLAYING" &&
                !item.mulaiMain
            ) {

                html += `

                    <button
                        class="btn-start"
                        onclick="
                            mulaiSesi(
                                '${escapeHTML(
                                    item.queueId
                                )}'
                            )
                        "
                    >

                        ▶️ MULAI SESI

                    </button>


                    <button
                        class="btn-delete"
                        onclick="
                            hapus(
                                '${escapeHTML(
                                    item.queueId
                                )}'
                            )
                        "
                    >

                        ❌ BATALKAN

                    </button>

                `;

            }


            /*
               PLAYING
            */

            if (
                item.status ===
                "PLAYING" &&
                item.mulaiMain
            ) {

                html += `

                    <button
                        class="btn-add"
                        onclick="
                            ubahDurasi(
                                '${escapeHTML(
                                    item.queueId
                                )}',
                                30
                            )
                        "
                    >

                        ➕ +30 MENIT

                    </button>


                    <button
                        class="btn-minus"
                        onclick="
                            ubahDurasi(
                                '${escapeHTML(
                                    item.queueId
                                )}',
                                -30
                            )
                        "
                    >

                        ➖ -30 MENIT

                    </button>


                    <button
                        class="btn-done"
                        onclick="
                            selesaikan(
                                '${escapeHTML(
                                    item.queueId
                                )}'
                            )
                        "
                    >

                        ✅ SELESAI

                    </button>

                `;

            }


            html += `

                </div>

            </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   REFRESH BUTTON
===================================================== */

document
    .getElementById(
        "refreshButton"
    )
    .addEventListener(
        "click",
        async function() {

            if (
                sedangProses
            ) return;


            tampilkanToast(
                "🔄 REFRESH",
                "Memperbarui data PLAYNEST...",
                ""
            );


            await muatData();

        }
    );


/* =====================================================
   TIMER LOOP
===================================================== */

setInterval(
    function() {

        if (
            sudahLogin
        ) {

            render();

        }

    },
    1000
);


/* =====================================================
   SERVER SYNC LOOP
===================================================== */

setInterval(
    function() {

        if (
            sudahLogin &&
            !sedangProses
        ) {

            muatData();

        }

    },
    REFRESH_INTERVAL
);


/* =====================================================
   START APP
===================================================== */

if (
    sudahLogin
) {

    muatData();

}

</script>

</body>
