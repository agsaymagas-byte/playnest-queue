<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAYNEST Queue</title>

<style>
    * { box-sizing: border-box; }

    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 20px 16px 60px;
        background-color: #f4f5f7;
        color: #1c1c1e;
    }

    h1 { font-size: 36px; margin-bottom: 4px; color: #111; }
    h2 { font-size: 24px; margin-top: 10px; color: #333; }
    h3 { font-size: 20px; margin: 24px 0 10px; color: #333; }
    p.sub { font-size: 16px; color: #666; margin-top: 0; }

    #statusKoneksi { font-size: 13px; color: #999; margin-bottom: 6px; }
    #statusKoneksi.error { color: #c0392b; font-weight: bold; }

    #panggilanBanner {
        max-width: 700px; margin: 20px auto; padding: 20px;
        border-radius: 16px; background: #e9ecef; transition: background 0.3s ease;
    }
    #panggilanBanner.aktif {
        background: linear-gradient(135deg, #2ecc71, #27ae60);
        color: white; animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.6); }
        70%  { box-shadow: 0 0 0 16px rgba(46, 204, 113, 0); }
        100% { box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
    }
    #panggilanBanner .label { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.85; }
    #panggilanBanner .nomorBesar { font-size: 40px; font-weight: bold; margin: 6px 0; }

    .gameGrid {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px; max-width: 900px; margin: 24px auto;
    }
    .gameCard { background: white; border-radius: 14px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: left; }
    .gameCard h4 { margin: 0 0 8px; font-size: 20px; }
    .gameCard .waiting-count { font-size: 13px; color: #888; margin-bottom: 10px; }
    .gameCard button { width: 100%; padding: 12px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 8px; font-weight: bold; }
    .btnAmbil { background: #3498db; color: white; }
    .btnPanggil { background: #f39c12; color: white; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .antreanList { list-style: none; padding: 0; margin: 10px 0 0; font-size: 14px; max-height: 140px; overflow-y: auto; }
    .antreanList li { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-bottom: 1px solid #eee; }
    .antreanList li.playing { background: #eafaf1; }

    .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: bold; }
    .badge.waiting { background: #fdecea; color: #c0392b; }
    .badge.playing { background: #eafaf1; color: #1e8449; }

    #adminSection { max-width: 900px; margin: 40px auto 0; background: white; border-radius: 14px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    #adminToggle { background: #34495e; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 15px; margin-bottom: 12px; }
    #adminPanelBody { display: none; text-align: left; }
    #adminPanelBody.show { display: block; }

    .adminRow { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid #eee; font-size: 14px; flex-wrap: wrap; gap: 6px; }
    .adminRow button { padding: 6px 12px; font-size: 13px; border: none; border-radius: 6px; cursor: pointer; color: white; }
    .btnHapus { background: #e74c3c; }
    .btnSelesai { background: #27ae60; }

    #resetAllBtn { margin-top: 14px; background: #c0392b; color: white; border: none; padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .empty-msg { color: #999; font-size: 14px; padding: 10px 0; }
</style>
</head>

<body>

<h1>PLAYNEST</h1>
<h2>Digital Queue System</h2>
<p class="sub">Selamat datang di PLAYNEST. Tersedia 4 jenis permainan.</p>
<p id="statusKoneksi">Menghubungkan ke server...</p>
<p><a href="dashboard.html" style="color:#3498db;font-weight:bold;">📺 Buka Dashboard Captain</a></p>

<div id="panggilanBanner">
    <div class="label">Status Panggilan</div>
    <div class="nomorBesar" id="panggilanNomor">Belum ada panggilan</div>
    <div id="panggilanCustomer"></div>
</div>

<div class="gameGrid" id="gameGrid"></div>

<div id="adminSection">
    <button id="adminToggle" onclick="toggleAdmin()">🔧 Panel Admin</button>
    <div id="adminPanelBody">
        <h3>Semua Antrean</h3>
        <div id="adminList"></div>
        <button id="resetAllBtn" onclick="resetSemua()">Reset Semua Antrean</button>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzRkt6iHzcNTegWjfkc8JKoch4sB1_iF-lRsBIAbqgDqVJHO9ytQHbFF5O6R7mSiw5fSA/exec";

    const JENIS_GAME = ["PS5", "PS4", "Nintendo", "Racing"];
    let semuaAntrean = [];
    let sedangProses = false;
    let bannerQueueId = null;

    async function panggilAPI(params) {
        params._ts = Date.now();
        let url = API_URL + "?" + new URLSearchParams(params).toString();
        let res = await fetch(url, { cache: "no-store" });
        let json = await res.json();
        return json;
    }

    async function muatData() {
        try {
            let hasil = await panggilAPI({ action: "list" });
            if (hasil.success) {
                semuaAntrean = hasil.data;
                document.getElementById("statusKoneksi").textContent = "Terhubung — data tersinkron";
                document.getElementById("statusKoneksi").classList.remove("error");
                render();
            } else {
                tampilkanErrorKoneksi(hasil.message);
            }
        } catch (err) {
            tampilkanErrorKoneksi(err.toString());
        }
    }

    function tampilkanErrorKoneksi(pesan) {
        let el = document.getElementById("statusKoneksi");
        el.textContent = "Gagal terhubung ke server. Cek API_URL. (" + pesan + ")";
        el.classList.add("error");
    }

    async function ambilAntrean(game) {
        if (sedangProses) return;
        let namaCustomer = prompt("Nama customer:", "");
        if (namaCustomer === null) return;
        if (namaCustomer.trim() === "") namaCustomer = "Tanpa Nama";

        let jumlahPlayer = prompt("Jumlah pemain:", "1");
        if (jumlahPlayer === null) return;
        jumlahPlayer = parseInt(jumlahPlayer) || 1;

        sedangProses = true;
        let hasil = await panggilAPI({
            action: "add", game: game, customer: namaCustomer, players: jumlahPlayer
        });
        sedangProses = false;

        if (!hasil.success) {
            alert("Gagal menambah antrean: " + hasil.message);
            return;
        }
        await muatData();
    }

    async function panggilAntrian(game) {
        if (sedangProses) return;

        let durasi = prompt("Durasi sesi main (menit):", "60");
        if (durasi === null) return;
        durasi = parseInt(durasi) || 60;

        sedangProses = true;
        let hasil = await panggilAPI({ action: "call", game: game, durasi: durasi });
        sedangProses = false;

        if (!hasil.success) {
            alert(hasil.message || "Tidak ada antrean menunggu untuk " + game);
            return;
        }

        tampilkanBanner(hasil, game);
        await muatData();
    }

    function tampilkanBanner(item, game) {
        let banner = document.getElementById("panggilanBanner");
        banner.classList.add("aktif");
        document.getElementById("panggilanNomor").innerText = item.queueId;
        document.getElementById("panggilanCustomer").innerText =
            item.customer + " — " + item.players + " pemain (" + game + ")";
        bannerQueueId = item.queueId;
    }

    function resetBanner() {
        document.getElementById("panggilanBanner").classList.remove("aktif");
        document.getElementById("panggilanNomor").innerText = "Belum ada panggilan";
        document.getElementById("panggilanCustomer").innerText = "";
        bannerQueueId = null;
    }

    async function tandaiSelesai(queueId) {
        if (sedangProses) return;
        sedangProses = true;
        await panggilAPI({ action: "done", queueId: queueId });
        sedangProses = false;

        if (queueId === bannerQueueId) {
            resetBanner();
        }

        await muatData();
    }

    async function hapusAntrean(queueId) {
        if (!confirm("Hapus antrean " + queueId + "?")) return;
        sedangProses = true;
        await panggilAPI({ action: "delete", queueId: queueId });
        sedangProses = false;

        if (queueId === bannerQueueId) {
            resetBanner();
        }

        await muatData();
    }

    async function resetSemua() {
        if (!confirm("Reset SEMUA antrean & nomor urut? Tindakan ini tidak bisa dibatalkan.")) return;
        sedangProses = true;
        await panggilAPI({ action: "resetAll" });
        sedangProses = false;
        resetBanner();
        await muatData();
    }

    function toggleAdmin() {
        document.getElementById("adminPanelBody").classList.toggle("show");
    }

    function render() {
        let grid = document.getElementById("gameGrid");
        grid.innerHTML = "";

        JENIS_GAME.forEach(game => {
            let daftarGame = semuaAntrean.filter(i => i.game === game);
            let menunggu = daftarGame.filter(i => i.status === "WAITING");

            let card = document.createElement("div");
            card.className = "gameCard";

            let listHtml = "";
            if (daftarGame.length === 0) {
                listHtml = '<p class="empty-msg">Belum ada antrean</p>';
            } else {
                listHtml = '<ul class="antreanList">' +
                    daftarGame.map(item => {
                        let cls = item.status === "PLAYING" ? "playing" : "";
                        let badgeCls = item.status === "PLAYING" ? "playing" : "waiting";
                        return `<li class="${cls}">
                            <span>${item.queueId} — ${item.customer} (${item.players}p)</span>
                            <span class="badge ${badgeCls}">${item.status}</span>
                        </li>`;
                    }).join("") + '</ul>';
            }

            card.innerHTML = `
                <h4>${game}</h4>
                <div class="waiting-count">${menunggu.length} menunggu</div>
                <button class="btnAmbil" onclick="ambilAntrean('${game}')">Ambil Antrean</button>
                <button class="btnPanggil" onclick="panggilAntrian('${game}')">Panggil Berikutnya</button>
                ${listHtml}
            `;
            grid.appendChild(card);
        });

        let adminList = document.getElementById("adminList");
        if (semuaAntrean.length === 0) {
            adminList.innerHTML = '<p class="empty-msg">Belum ada antrean sama sekali</p>';
        } else {
            adminList.innerHTML = semuaAntrean.map(item => `
                <div class="adminRow">
                    <span>${item.queueId} — ${item.customer} (${item.players}p) — <b>${item.status}</b></span>
                    <span>
                        <button class="btnSelesai" onclick="tandaiSelesai('${item.queueId}')">Selesai</button>
                        <button class="btnHapus" onclick="hapusAntrean('${item.queueId}')">Hapus</button>
                    </span>
                </div>
            `).join("");
        }
    }

    muatData();
    setInterval(muatData, 3000);
</script>

</body>
</html>
